<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0908">
<title>咒术人生</title>
<style>
:root{--bg:#0a0908;--paper:#12100d;--panel:#16140f;--ink:#d4cdbd;--ink2:#8a8275;--ink3:#4e4a42;--line:#1f1c17;--line2:#2c2720;--gold:#a08a56;--blood:#8a3a2e;--jade:#5a6a4a;--ice:#5a7a8a;--violet:#6a5a7a;--ember:#a05838;--serif:'Songti SC','Noto Serif JP','Source Han Serif SC',Georgia,serif;--mono:ui-monospace,'SF Mono',Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--serif);overflow:hidden;-webkit-font-smoothing:antialiased;font-size:16px;letter-spacing:.02em}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:999;opacity:.22;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.13'/%3E%3C/svg%3E")}
#app{position:relative;z-index:5;height:100%;max-width:820px;margin:0 auto;display:flex;flex-direction:column}
#bar{padding:calc(9px + env(safe-area-inset-top)) 16px 6px;border-bottom:1px solid var(--line);flex-shrink:0}
.bar1{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px;gap:10px}
#bname{font-size:14px;letter-spacing:.2em;color:var(--ink)}
#btime{font-size:10px;color:var(--ink3);font-family:var(--mono);letter-spacing:.15em}
.bar2{display:flex;gap:9px;font-size:9px;color:var(--ink3);font-family:var(--mono);flex-wrap:wrap}
.bar2 b{color:var(--ink2);font-weight:400;margin-left:2px}
.bar2 .warn b{color:var(--blood)}.bar2 .ok b{color:var(--jade)}.bar2 .gold b{color:var(--gold)}.bar2 .ice b{color:var(--ice)}.bar2 .em b{color:var(--ember)}
#tabs{display:flex;border-bottom:1px solid var(--line);flex-shrink:0;padding:0 6px;overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:none;color:var(--ink3);padding:8px 9px;font-size:9px;font-family:var(--mono);letter-spacing:.15em;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:all .2s;flex-shrink:0}
.tab.on{color:var(--ink);border-bottom-color:var(--gold)}
#main{flex:1;overflow-y:auto;padding:18px 16px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#main::-webkit-scrollbar{display:none}
.msg{margin-bottom:22px;animation:in .5s ease}
@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.msg .who{font-size:8.5px;color:var(--ink3);font-family:var(--mono);letter-spacing:.3em;margin-bottom:7px}
.msg .body{font-size:15.5px;line-height:2.05;white-space:pre-wrap;color:var(--ink);letter-spacing:.03em}
.msg.p .who{color:var(--gold)}
.msg.p .body{color:var(--ink2);font-style:italic;padding-left:12px;border-left:1px solid var(--line2);font-size:14.5px}
.msg.err .body{color:var(--blood)}
.msg.sys .who{color:var(--jade)}.msg.sys .body{color:var(--ink2);font-size:13px}
.msg.ev .who{color:var(--violet)}.msg.ev .body{border-left:2px solid var(--violet);padding-left:12px;font-style:italic}
.msg.ai .who{color:var(--gold)}.msg.ai .body{border-left:2px solid var(--gold);padding-left:12px;color:#e8dfc8}
.cur::after{content:'▌';color:var(--gold);animation:bk 1.1s steps(1) infinite;font-size:.85em;margin-left:1px}
@keyframes bk{50%{opacity:0}}
.sec{font-size:10px;letter-spacing:.3em;color:var(--ink3);font-family:var(--mono);margin:18px 0 9px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.sec:first-child{margin-top:0}
.line{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #1a1713;font-size:13px;gap:8px}
.line .l{color:var(--ink3);font-family:var(--mono);font-size:10.5px;flex-shrink:0}
.line .v{color:var(--ink);text-align:right;max-width:65%}
.line .v.gold{color:var(--gold)}.line .v.b{color:var(--blood)}.line .v.g{color:var(--jade)}.line .v.i{color:var(--ice)}.line .v.em{color:var(--ember)}
.card{background:var(--paper);border-left:2px solid var(--line2);padding:9px 11px;margin-bottom:6px;font-size:12.5px;line-height:1.7}
.card .t{color:var(--ink);font-size:13px;margin-bottom:3px}
.card .s{color:var(--ink3);font-size:10px;font-family:var(--mono);margin-bottom:4px}
.card .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tg{display:inline-block;background:#1a1713;border:1px solid var(--line2);color:var(--ink2);border-radius:9px;padding:1px 6px;font-size:9px;font-family:var(--mono)}
.tg.gold{color:var(--gold);border-color:#3a3020}.tg.b{color:var(--blood);border-color:#3a2020}.tg.g{color:var(--jade);border-color:#203020}.tg.i{color:var(--ice);border-color:#203040}.tg.v{color:var(--violet);border-color:#30203a}
.pb{height:2px;background:#1a1713;margin:3px 0 9px;overflow:hidden}
.pb .f{height:100%;transition:width .4s}
.pb .f.hp{background:linear-gradient(90deg,#5a3a2a,#a08a6a)}
.pb .f.ce{background:linear-gradient(90deg,#2a4a5a,#6a8aa0)}
.pb .f.exp{background:linear-gradient(90deg,#6a5a2a,#a09050)}
.opts{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.opt{background:var(--paper);border:1px solid var(--line2);color:var(--ink);padding:9px 12px;text-align:left;font-family:var(--serif);font-size:13px;cursor:pointer;transition:all .2s;border-radius:0;line-height:1.5;display:flex;justify-content:space-between;align-items:center;gap:8px}
.opt:active{border-color:var(--gold);background:var(--panel)}
.opt:disabled{opacity:.4}
.opt .txt{flex:1}
#foot{padding:9px 14px calc(13px + env(safe-area-inset-bottom));border-top:1px solid var(--line);flex-shrink:0;background:var(--bg);max-height:65vh;overflow-y:auto;scrollbar-width:none}
#foot::-webkit-scrollbar{display:none}
#options{display:none;flex-direction:column;gap:5px;margin-bottom:9px}
#options.show{display:flex}
#options .lbl{font-size:9px;color:var(--ink3);font-family:var(--mono);letter-spacing:.3em;margin-bottom:2px;padding-left:2px;display:flex;justify-content:space-between}
#options .lbl .hint{color:var(--gold);font-size:8.5px;letter-spacing:.15em}
.optbtn{background:var(--panel);border:1px solid var(--line2);color:var(--ink);padding:9px 12px;text-align:left;font-family:var(--serif);font-size:13px;cursor:pointer;transition:all .18s;border-radius:0;line-height:1.5;display:flex;justify-content:space-between;align-items:center;gap:8px}
.optbtn:active{border-color:var(--gold);background:#1a1713}
.optbtn .txt{flex:1}
.optbtn .pen{font-size:10px;color:var(--ink3);flex-shrink:0;padding:2px 6px}
#row{display:flex;gap:8px;align-items:flex-end}
#inp{flex:1;background:none;border:none;border-bottom:1px solid var(--line2);color:var(--ink);font-family:var(--serif);font-size:15px;line-height:1.65;padding:8px 0;resize:none;outline:none;max-height:110px;transition:border-color .3s}
#inp:focus{border-bottom-color:var(--gold)}
#inp::placeholder{color:var(--ink3);font-style:italic}
#send{width:38px;height:38px;border-radius:50%;background:none;border:1px solid var(--line2);color:var(--ink2);font-size:14px;cursor:pointer;flex-shrink:0;font-family:var(--mono)}
#send:active{border-color:var(--gold);color:var(--gold)}
#send:disabled{opacity:.25}
/* ==== 设置界面 ==== */
#setup{position:fixed;inset:0;background:var(--bg);z-index:400;display:flex;flex-direction:column;overflow-y:auto;padding:calc(28px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));scrollbar-width:none}
#setup::-webkit-scrollbar{display:none}
.logo{text-align:center;margin-bottom:22px}
.logo h1{font-size:24px;letter-spacing:.6em;font-weight:400;color:var(--ink);margin-bottom:5px;padding-left:.6em}
.logo .sub{font-size:9px;color:var(--ink3);letter-spacing:.5em;font-family:var(--mono);padding-left:.5em}
.logo .ln{width:36px;height:1px;background:var(--gold);margin:14px auto 0;opacity:.55}
.sec-t{font-size:9.5px;letter-spacing:.35em;color:var(--ink3);font-family:var(--mono);margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.fld{margin-bottom:9px}
.fld label{display:block;font-size:9.5px;color:var(--ink3);letter-spacing:.2em;margin-bottom:5px;font-family:var(--mono)}
.fld input,.fld select,.fld textarea{width:100%;background:none;border:none;border-bottom:1px solid var(--line2);color:var(--ink);padding:6px 0;font-family:var(--serif);font-size:14px;outline:none;border-radius:0;transition:border-color .3s}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-bottom-color:var(--gold)}
.fld textarea{resize:vertical;min-height:40px;line-height:1.7;font-size:13px}
.fld select{-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 9px) 15px,calc(100% - 4px) 15px;background-size:5px 5px;background-repeat:no-repeat}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:9.5px;color:var(--ink3);font-family:var(--mono);line-height:1.65;margin-top:6px}
.hint a{color:var(--gold);text-decoration:none;border-bottom:1px dotted var(--gold)}
.go{width:100%;background:none;border:1px solid var(--gold);color:var(--gold);padding:14px;font-size:12px;letter-spacing:.6em;font-family:var(--serif);margin-top:22px;cursor:pointer;padding-left:.6em}
.go:active{background:var(--gold);color:var(--bg)}
.bar3{display:flex;gap:18px;margin-top:14px;justify-content:center;flex-wrap:wrap}
.bar3 button{background:none;border:none;color:var(--ink3);padding:6px 0;font-size:9.5px;font-family:var(--mono);letter-spacing:.3em;cursor:pointer}
/* ==== 建角界面 ==== */
#create{position:fixed;inset:0;background:var(--bg);z-index:450;display:none;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 16px calc(12px + env(safe-area-inset-bottom))}
#create.on{display:flex}
#cTop{border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px;flex-shrink:0}
#cTop .title{font-size:13px;letter-spacing:.3em;color:var(--gold);margin-bottom:6px}
#cTop .progress{font-size:9px;color:var(--ink3);font-family:var(--mono);letter-spacing:.15em}
#cArchive{background:var(--paper);border:1px solid var(--line2);padding:8px 10px;margin-bottom:10px;font-size:11px;line-height:1.7;max-height:130px;overflow-y:auto;flex-shrink:0;scrollbar-width:none}
#cArchive::-webkit-scrollbar{display:none}
#cArchive .k{color:var(--ink3);font-family:var(--mono);font-size:9.5px;letter-spacing:.15em}
#cArchive .v{color:var(--ink)}
#cChat{flex:1;overflow-y:auto;padding:4px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#cChat::-webkit-scrollbar{display:none}
#cFoot{flex-shrink:0;padding-top:10px;border-top:1px solid var(--line)}
.cmsg{margin-bottom:16px;animation:in .4s ease}
.cmsg .who{font-size:8.5px;color:var(--ink3);font-family:var(--mono);letter-spacing:.3em;margin-bottom:5px}
.cmsg .body{font-size:14.5px;line-height:1.95;white-space:pre-wrap;color:var(--ink)}
.cmsg.q .body{color:var(--gold);font-size:14px}
.cmsg.p .body{color:var(--ink2);font-style:italic;padding-left:10px;border-left:1px solid var(--line2)}
.cmsg.s .body{color:var(--ink2);font-size:12.5px;font-family:var(--mono);line-height:1.7}
.btn-group{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.bg{background:var(--paper);border:1px solid var(--line2);color:var(--ink);padding:7px 11px;font-size:12px;cursor:pointer;font-family:var(--serif);flex:1 0 auto;text-align:left;border-radius:0;line-height:1.5}
.bg:active{border-color:var(--gold);background:var(--panel)}
.bg.gold{border-color:#3a3020;color:var(--gold)}
.bg.done{opacity:.5}
#death{position:fixed;inset:0;background:#050505;z-index:500;display:none;flex-direction:column;align-items:center;justify-content:center;padding:40px 26px;text-align:center;animation:in 1.2s}
#death.on{display:flex}
#death .m{font-size:10.5px;color:var(--gold);letter-spacing:.7em;font-family:var(--mono);margin-bottom:26px;padding-left:.7em}
#death .g{font-size:72px;color:var(--blood);letter-spacing:.4em;margin-bottom:30px;font-weight:300;padding-left:.4em}
#death .e{font-size:12.5px;color:var(--ink2);line-height:2.2;max-width:440px;margin-bottom:38px;white-space:pre-wrap}
#death .btn{background:none;border:1px solid var(--gold);color:var(--gold);padding:12px 28px;font-size:10.5px;letter-spacing:.5em;font-family:var(--serif);cursor:pointer;padding-left:.5em}
#modal,#pm{position:fixed;inset:0;background:rgba(5,5,5,.95);z-index:600;display:none;align-items:center;justify-content:center;padding:18px}
#modal.on,#pm.on{display:flex}
#modal .inner,#pm .inner{background:var(--paper);border:1px solid var(--line2);max-width:540px;width:100%;padding:20px;max-height:85vh;overflow-y:auto}
#modal h3,#pm h3{font-size:12.5px;letter-spacing:.25em;margin-bottom:12px;color:var(--ink);font-weight:400}
#modal textarea{width:100%;background:var(--bg);border:1px solid var(--line2);color:var(--ink);font-family:var(--mono);font-size:10.5px;line-height:1.6;padding:9px;min-height:200px;outline:none}
#pm input,#pm textarea{width:100%;background:var(--bg);border:1px solid var(--line2);color:var(--ink);font-family:var(--serif);font-size:14px;padding:9px;outline:none;line-height:1.6}
#pm textarea{min-height:100px;resize:vertical}
#modal .btns,#pm .btns{display:flex;gap:9px;margin-top:12px}
#modal .btns button,#pm .btns button{flex:1;background:none;border:1px solid var(--line2);color:var(--ink2);padding:9px;font-size:10.5px;font-family:var(--mono);letter-spacing:.2em;cursor:pointer}
#modal .btns button.primary,#pm .btns button.primary{border-color:var(--gold);color:var(--gold)}
</style>
</head>
<body>

<!-- 设置 -->
<div id="setup">
<div class="logo"><h1>咒术人生</h1><div class="sub">JUJUTSU KAISEN</div><div class="ln"></div></div>
<div class="sec-t">◈ 接 入 A I</div>
<div class="fld"><label>服务商</label><select id="pProv"><option value="deepseek">DeepSeek（推荐）</option><option value="openai">OpenAI</option><option value="custom">自定义</option></select></div>
<div class="fld"><label>API Key</label><input type="password" id="pKey" placeholder="sk-..." autocomplete="off" autocapitalize="off"><div class="hint" id="pHint">去 <a href="https://platform.deepseek.com" target="_blank">platform.deepseek.com</a> 拿 key。</div></div>
<div class="fld" id="urlF" style="display:none"><label>接口地址</label><input type="text" id="pUrl" placeholder="https://.../v1/chat/completions" autocapitalize="off"></div>
<div class="fld" id="modF" style="display:none"><label>模型名</label><input type="text" id="pModel" placeholder="qwen-plus" autocapitalize="off"></div>

<div class="fld"><select id="pEra">

</select></div>
<button class="go" id="startBtn">开 始 创 建 角 色</button>
<div class="bar3"><button id="loadBtn">读 取 存 档</button><button id="helpBtn">说 明</button><button id="clearBtn">删 除 存 档</button></div>
</div>

<!-- 建角 -->
<div id="create">
<div id="cTop">
<div class="title">创 建 角 色</div>
<div class="progress" id="cProgress">—</div>
</div>
<div id="cArchive"></div>
<div id="cChat"></div>
<div id="cFoot">
<div id="cButtons" class="btn-group"></div>
<div id="cInputRow" style="display:none;margin-top:8px">
<textarea id="cInput" rows="1" placeholder="说出你的想法……" style="flex:1;background:none;border:none;border-bottom:1px solid var(--line2);color:var(--ink);font-family:var(--serif);font-size:14px;padding:6px 0;resize:none;outline:none;width:100%;max-height:80px"></textarea>
<div style="display:flex;gap:6px;margin-top:6px">
<button class="bg" id="cSend" style="flex:1">发送</button>
<button class="bg" id="cCancel" style="flex:1">取消</button>
</div>
</div>
</div>
</div>

<!-- 游戏 -->
<div id="app" style="display:none">
<div id="bar"><div class="bar1"><div id="bname" class="dim">—</div><div id="btime">—</div></div><div class="bar2" id="bstat"></div></div>
<div id="tabs">
<button class="tab on" data-tab="story">叙 事</button>
<button class="tab" data-tab="char">人 物</button>
<button class="tab" data-tab="skill">术 式</button>
<button class="tab" data-tab="npc">关 系</button>
<button class="tab" data-tab="quest">任 务</button>
<button class="tab" data-tab="shop">商 店</button>
<button class="tab" data-tab="world">世 界</button>
<button class="tab" data-tab="codex">图 鉴</button>
<button class="tab" data-tab="sys">系 统</button>
</div>
<div id="main"></div>
<div id="foot">
<div id="options"></div>
<div id="row"><textarea id="inp" rows="1" placeholder="你要做什么……"></textarea><button id="send">→</button></div>
</div>
</div>

<div id="death"><div class="m">终</div><div class="g">死</div><div class="e" id="epi"></div><button class="btn primary" id="restart">重 新 开 始</button></div>
<div id="modal"><div class="inner"><h3 id="modalTitle">存档</h3><textarea id="modalText"></textarea><div class="btns"><button id="modalClose">关闭</button><button id="modalAction" class="primary">确定</button></div></div></div>
<div id="pm"><div class="inner"><h3 id="pmTitle">输入</h3><textarea id="pmInput"></textarea><div class="btns"><button id="pmCancel">取消</button><button id="pmOk" class="primary">确定</button></div></div></div>

/* ==================== 初始化 ==================== */
function apiUrl(){if(CFG.provider==='deepseek')return'https://api.deepseek.com/chat/completions';if(CFG.provider==='openai')return'https://api.openai.com/v1/chat/completions';return CFG.url}
function apiModel(){if(CFG.provider==='deepseek')return'deepseek-chat';if(CFG.provider==='openai')return'gpt-4o-mini';return CFG.model}

async function callAI(sysPrompt,messages,onDelta,maxTokens){
  var msgs=[{role:'system',content:sysPrompt}].concat(messages);
  var res=await fetch(apiUrl(),{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+CFG.key},body:JSON.stringify({model:apiModel(),messages:msgs,stream:true,temperature:1.0,max_tokens:maxTokens||1000,top_p:.95})});
  if(!res.ok){var t=await res.text();throw new Error('API '+res.status+'：'+t.slice(0,200))}
  var reader=res.body.getReader(),dec=new TextDecoder(),buf='',full='';
  while(true){
    var r=await reader.read();if(r.done)break;
    buf+=dec.decode(r.value,{stream:true});
    var lines=buf.split('\n');buf=lines.pop()||'';
    for(var i=0;i<lines.length;i++){
      var line=lines[i];if(line.indexOf('data: ')!==0)continue;
      var d=line.slice(6).trim();if(d==='[DONE]')continue;
      try{var j=JSON.parse(d);var delta=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;if(delta){full+=delta;if(onDelta)onDelta(full)}}catch(e){}
    }
  }
  return full;
}

/* ==================== 建角流程 ==================== */
function initCreate(){
  CREATE={step:0,data:{},chat:[],era:$('pEra').value};
  $('setup').style.display='none';
  $('create').classList.add('on');
  renderCreate();
  askStep();
}
function askStep(){
  var step=CREATE_STEPS[CREATE.step];
  if(!step){finishCreate();return}
  var sug=step.suggest(CREATE.data);
  renderCreateQuestion(step.q,sug);
}
function renderCreateQuestion(q,suggestions){
  var el=$('cChat');
  var d=document.createElement('div');d.className='cmsg q';
  d.innerHTML='<div class="who">问</div><div class="body">'+q+'</div>';
  el.appendChild(d);
  el.scrollTop=el.scrollHeight;
  // 按钮
  var btn=$('cButtons');btn.innerHTML='';
  suggestions.forEach(function(s){
    var b=document.createElement('button');b.className='bg';
    b.textContent=s;
    b.onclick=function(){pickAnswer(s)};
    btn.appendChild(b);
  });
  var bCustom=document.createElement('button');bCustom.className='bg';
  bCustom.textContent='✎ 我自己写';
  bCustom.onclick=function(){showCustomInput()};
  btn.appendChild(bCustom);
  var bTalk=document.createElement('button');bTalk.className='bg';
  bTalk.textContent='🤖 和 AI 商量';
  bTalk.onclick=function(){showAiTalk()};
  btn.appendChild(bTalk);
  $('cInputRow').style.display='none';
}
function pickAnswer(text){
  var step=CREATE_STEPS[CREATE.step];
  var key=step.key;
  // 若文本含 " — " 取前半
  var val=text.indexOf(' — ')>0?text.split(' — ')[0]:text;
  CREATE.data[key]=val;
  appendCreateMsg('p','选择：'+text);
  updateArchive();
  CREATE.step++;
  setTimeout(askStep,300);
}
function showCustomInput(){
  $('cInputRow').style.display='';
  $('cInput').value='';
  $('cInput').placeholder='输入你的答案……';
  $('cInput').focus();
}
function showAiTalk(){
  $('cInputRow').style.display='';
  $('cInput').value='';
  $('cInput').placeholder='说出你的想法，比如"我想要一个被家族抛弃的禅院家旁支"……';
  $('cInput').focus();
}
function appendCreateMsg(who,text){
  var el=$('cChat');
  var d=document.createElement('div');d.className='cmsg '+who;
  d.innerHTML='<div class="who">'+(who==='p'?'你':who==='s'?'系统':'AI')+'</div><div class="body">'+text+'</div>';
  el.appendChild(d);el.scrollTop=el.scrollHeight;
}
async function handleCreateInput(){
  var val=$('cInput').value.trim();
  if(!val)return;
  var step=CREATE_STEPS[CREATE.step];
  appendCreateMsg('p',val);
  $('cInputRow').style.display='none';
  // 判断是自定义还是和 AI 商量
  // 如果输入较短（<25字）且不像描述 → 直接当答案
  // 否则让 AI 帮忙落地
  if(val.length<25){
    pickAnswer(val);
    return;
  }
  // AI 商量
  var btn=$('cButtons');btn.innerHTML='';
  appendCreateMsg('s','AI 正在根据咒术回战世界观帮你落地……');
  var sys='你是《咒术回战》世界的角色创建助手。玩家正在创建角色，需要你根据原著世界观，把玩家模糊的想法落地成具体的设定。\n\n当前项目：'+step.q+'\n玩家已确认的档案：'+JSON.stringify(CREATE.data,null,2)+'\n\n玩家说了：'+val+'\n\n请给出 1-3 个具体落地方案，每个方案一句话，用数字或短横线分隔。每个方案必须是咒术回战世界观里合理存在的。直接输出方案，不要客套。';
  try{
    var reply=await callAI(sys,[{role:'user',content:'帮我落地'}],null,500);
    appendCreateMsg('ai',reply);
    // 把 AI 的回复拆成方案按钮
    var lines=reply.split('\n').filter(function(l){return l.trim().length>0});
    lines.forEach(function(l){
      var clean=l.replace(/^[0-9]+[.、)\-]\s*/,'').replace(/^[-·•]\s*/,'').trim();
      if(clean.length<5||clean.length>80)return;
      var b=document.createElement('button');b.className='bg gold';
      b.textContent=clean;
      b.onclick=function(){pickAnswer(clean)};
      btn.appendChild(b);
    });
    // 保留自定义和商量
    var b1=document.createElement('button');b1.className='bg';b1.textContent='✎ 我自己写';b1.onclick=showCustomInput;btn.appendChild(b1);
    var b2=document.createElement('button');b2.className='bg';b2.textContent='🤖 继续商量';b2.onclick=showAiTalk;btn.appendChild(b2);
  }catch(e){
    appendCreateMsg('s','AI 出错：'+e.message+'。可以直接输入你的答案。');
    showCustomInput();
  }
}
function updateArchive(){
  var el=$('cArchive');
  var keys=CREATE_STEPS.filter(function(s){return CREATE.data[s.key]!==undefined}).map(function(s){
    return '<div><span class="k">'+s.key+'：</span><span class="v">'+CREATE.data[s.key]+'</span></div>';
  });
  el.innerHTML=keys.length?keys.join(''):'<span style="color:var(--ink3)">尚未确认任何项目……</span>';
  var total=CREATE_STEPS.length,cur=CREATE.step;
  $('cProgress').textContent='进度 '+cur+' / '+total;
}
function renderCreate(){
  updateArchive();
}
function finishCreate(){
  appendCreateMsg('s','所有项目已确认。');
  var d=CREATE.data;
  // 展示汇总
  appendCreateMsg('ai','档案确认：\n\n姓名：'+d.name+'\n性别：'+d.gender+'\n年龄：'+d.age+'\n出身：'+d.origin+'\n外貌：'+d.appearance+'\n体术：'+d.body+'\n天赋：'+d.talent+'\n术式：'+d.tech+'\n性格：'+d.personality+'\n目标：'+d.goal+'\n居住：'+d.location+'\n自述：'+(d.bio||'无'));
  var btn=$('cButtons');btn.innerHTML='';
  var b1=document.createElement('button');b1.className='bg gold';b1.textContent='▶ 就这样，开始人生';
  b1.onclick=launchGame;btn.appendChild(b1);
  var b2=document.createElement('button');b2.className='bg';b2.textContent='✎ 修改某一项';
  b2.onclick=function(){
    var keys=CREATE_STEPS.map(function(s,i){return(i+1)+'. '+s.key});
    showPrompt('修改哪一项？（输入名字）',keys.join('\n'),function(input){
      var k=input.trim();
      var idx=-1;
      CREATE_STEPS.forEach(function(s,i){if(s.key===k)idx=i});
      if(idx>=0){CREATE.step=idx;askStep()}
      else toast('没找到这一项');
    });
  };
  btn.appendChild(b2);
}

function newState(d){
  var era=parseInt(CREATE.era);
  var hpMax=100,ceMax=150,atk=15,ctrl=20,money=8000;
  var o=d.origin;
  if(o.indexOf('咒术师家庭')>=0){ceMax=280;atk=22;ctrl=35;money=30000}
  if(o.indexOf('御三家旁支')>=0){ceMax=320;atk=25;ctrl=40;money=150000}
  if(o.indexOf('天与咒缚')>=0){ceMax=0;atk=75;ctrl=5;hpMax=180}
  if(o.indexOf('受肉体')>=0||o.indexOf('容器')>=0){ceMax=600;hpMax=150}
  if(o.indexOf('星浆体')>=0){ceMax=500;hpMax=120}
  if(o.indexOf('非术师')>=0){ceMax=60;hpMax=90;atk=10;ctrl=15}
  if(o.indexOf('诅咒师家庭')>=0){ceMax=250;atk=28;ctrl=30;money=15000}
  if(o.indexOf('咒骸')>=0){ceMax=280;hpMax=110}
  if(o.indexOf('普通人觉醒')>=0){ceMax=180;atk=15;ctrl=20}
  // 天赋加成
  var tal=d.talent||'';
  if(tal.indexOf('咒力总量')>=0){ceMax+=150}
  if(tal.indexOf('控制')>=0){ctrl+=15}
  if(tal.indexOf('反応')>=0){atk+=5}
  if(tal.indexOf('肉体')>=0){hpMax+=30;atk+=8}
  if(tal.indexOf('直觉')>=0){ctrl+=10;atk+=3}
  if(tal.indexOf('反转')>=0){ctrl+=8}
  if(tal.indexOf('领域')>=0){ctrl+=5;ceMax+=50}
  // 体术加成
  var bd=d.body||'';
  if(bd.indexOf('空手')>=0){atk+=5}
  if(bd.indexOf('武器')>=0){atk+=3;ctrl+=2}
  if(bd.indexOf('轻身')>=0){atk+=3}
  if(bd.indexOf('重击')>=0){atk+=7;hpMax+=15}
  if(bd.indexOf('技巧')>=0){atk+=4;ctrl+=4}
  // 术式
  var tech=d.tech||'无';
  var innate=tech;
  if(tech.indexOf('无术式')>=0)innate='无';
  else if(tech.indexOf('简单的强化')>=0)innate='简单的强化术式';
  else if(tech.indexOf('十划咒法')>=0)innate='十划咒法';
  else if(tech.indexOf('刍灵咒法')>=0)innate='刍灵咒法';
  else if(tech.indexOf('赤血操术')>=0)innate='赤血操术';
  else if(tech.indexOf('十种影法术')>=0)innate='十种影法术（未完全觉醒）';
  else if(tech.indexOf('咒言')>=0)innate='咒言';
  else if(tech.indexOf('不义游戏')>=0)innate='不义游戏';
  else if(tech.indexOf('六眼')>=0)innate='六眼（未觉醒）';
  else if(tech.indexOf('星之怒')>=0)innate='星之怒（未觉醒）';
  else innate=tech;
  var inv=[];
  inv.push('绷带');
  if(o.indexOf('咒术师')>=0||o.indexOf('御三家')>=0)inv.push('咒具·短刀');
  if(o.indexOf('受肉体')>=0)inv.push('封印符（一张）');
  var fac={};for(var f in FACTIONS)fac[f]=FACTIONS[f].start;
  var traits=(d.personality||'').split(/[,，、]/).map(function(s){return s.trim()}).filter(Boolean).slice(0,3);
  return{name:d.name,gender:d.gender,age:parseInt(d.age)||15,origin:d.origin,era:era,
  appearance:d.appearance||'',body:d.body||'',talent:d.talent||'',
  time:{y:era,m:4,d:1,label:CREATE.era+'年4月'},location:d.location||'东京',
  identity:(parseInt(d.age)||15)<=18?'高专学生（预定）':'自由术师',grade:'未评级',
  hp:hpMax,hpMax:hpMax,ce:ceMax,ceMax:ceMax,atk:atk,ctrl:ctrl,money:money,reputation:0,
  exp:0,expMax:100,sp:3,
  innate:innate,technique:innate==='无'?'咒力操作（基础）':innate,
  domain:'未觉醒',reverse:'无',blackflash:0,vows:[],
  inventory:inv,flags:[],npcNotes:{},worldEvents:[],
  dead:false,deathCause:'',bio:d.bio||'',traits:traits,
  factions:fac,skills:[],equipment:{weapon:'wn',armor:'an',accessory:'an2'},
  quests:[],completedQuests:[],titles:[],sukunaFingers:[],diary:[]};
}

function stateToText(){
  if(!S)return'';
  var l=[];
  l.push('姓名：'+S.name+'｜'+S.gender+'｜'+S.age+'岁');
  l.push('出身：'+S.origin+'｜身份：'+S.identity+'｜等级：'+S.grade);
  l.push('所在地：'+S.location+'｜时间：'+S.time.label);
  if(S.appearance)l.push('外貌：'+S.appearance);
  if(S.body)l.push('体术风格：'+S.body);
  if(S.talent)l.push('核心天赋：'+S.talent);
  var eq=getEq();
  l.push('体力 '+S.hp+'/'+(S.hpMax+eq.hp)+'｜咒力 '+S.ce+'/'+(S.ceMax+eq.ce));
  l.push('战斗 '+S.atk+'+'+eq.atk+'='+(S.atk+eq.atk)+'｜控制 '+(S.ctrl+eq.ctrl));
  l.push('金钱 ¥'+S.money+'｜声望 '+S.reputation+'｜经验 '+S.exp+'/'+S.expMax+'｜技能点 '+S.sp);
  l.push('生得术式：'+(S.innate||'无')+'｜掌握：'+(S.technique||'无'));
  l.push('领域：'+S.domain+'｜反转：'+S.reverse+'｜黑闪：'+S.blackflash+'次');
  if(S.vows.length)l.push('束缚：'+S.vows.join('、'));
  l.push('持有物：'+(S.inventory.length?S.inventory.join('、'):'无'));
  var fac=[];for(var f in S.factions){if(S.factions[f]!==0)fac.push(f+(S.factions[f]>0?'+':'')+S.factions[f])}
  if(fac.length)l.push('势力好感：'+fac.join('，'));
  if(S.quests.length)l.push('进行中任务：'+S.quests.map(function(q){return q.n}).join('、'));
  if(S.titles.length)l.push('称号：'+S.titles.join('、'));
  if(S.sukunaFingers.length)l.push('已收集宿傩手指：'+S.sukunaFingers.length+'/20（编号'+S.sukunaFingers.join(',')+'）');
  if(S.flags.length)l.push('标记：'+S.flags.join('、'));
  if(Object.keys(S.npcNotes).length){
    l.push('对人物的了解：');
    for(var k in S.npcNotes)l.push('  ·'+k+'：'+S.npcNotes[k]);
  }
  if(S.worldEvents.length){
    l.push('世界近况：');
    S.worldEvents.slice(-8).forEach(function(w){l.push('  ·'+w)});
  }
  return l.join('\n');
}

/* ==================== 游戏：解析/渲染 ==================== */
function parseAI(full){
  var tsm=full.match(/^\[([^\]\n]{1,40})\]\s*/);
  var ts=tsm?tsm[1]:null;
  var rest=tsm?full.slice(tsm[0].length):full;
  rest=rest.replace(/<\/?叙事>/g,'');
  var oi=rest.search(/<选项?/),si=rest.search(/<状态?/);
  var ci=[oi,si].filter(function(x){return x>=0});
  var narrative=rest.slice(0,ci.length?Math.min.apply(null,ci):undefined).trim();
  var options=[];
  var om=rest.match(/<选项>([\s\S]*?)<\/选项>/);
  if(om){options=om[1].split('\n').map(function(l){return l.replace(/^[-·•*\d.\s、]+/,'').replace(/<\/?选项>/g,'').trim()}).filter(function(l){return l.length>0&&l.length<80}).slice(0,5)}
  var st=null;
  var sm=rest.match(/<状态>([\s\S]*?)<\/状态>/);
  if(sm){
    var js=sm[1].trim().replace(/^```(?:json)?\s*/,'').replace(/```\s*$/,'').trim();
    try{st=JSON.parse(js)}catch(e){try{st=JSON.parse(js.replace(/,\s*([}\]])/g,'$1'))}catch(e2){st=null}}
  }
  return{ts:ts,narrative:narrative,options:options,st:st};
}

function getEq(){
  var b={atk:0,def:0,hp:0,ce:0,ctrl:0};
  if(!S||!S.equipment)return b;
  var hasW=S.skills.indexOf('bt2')>=0;
  ['weapon','armor','accessory'].forEach(function(slot){
    var id=S.equipment[slot];if(!id)return;
    (EQUIPMENT[slot]||[]).forEach(function(it){if(it.id===id){b.atk+=it.atk||0;b.def+=it.def||0;b.hp+=it.hp||0;b.ce+=it.ce||0;b.ctrl+=it.ctrl||0}});
  });
  if(hasW)b.atk=Math.floor(b.atk*1.5);
  if(S.skills.indexOf('ce1')>=0)b.atk+=2;
  if(S.skills.indexOf('ce5')>=0)b.atk+=8;
  if(S.skills.indexOf('bt1')>=0)b.atk+=3;
  if(S.skills.indexOf('bt3')>=0)b.hp+=10;
  if(S.skills.indexOf('bt5')>=0)b.hp+=20;
  if(S.skills.indexOf('ce4')>=0)b.def+=4;
  if(S.skills.indexOf('ts1')>=0)b.ctrl+=5;
  return b;
}
function applySt(d){
  if(!d||!S)return;
  if(d.ts)S.time.label=d.ts;
  ['hp','hpMax','ce','ceMax','atk','ctrl','money','reputation','exp','expMax'].forEach(function(k){if(typeof d[k]==='number')S[k]=d[k]});
  ['grade','location','identity','innate','technique','domain','reverse'].forEach(function(k){if(d[k])S[k]=d[k]});
  if(typeof d.blackflash==='number')S.blackflash=d.blackflash;
  if(typeof d.skill_points==='number')S.sp=Math.max(0,(S.sp||0)+d.skill_points);
  if(Array.isArray(d.vows))S.vows=d.vows;
  if(Array.isArray(d.inventory_add))d.inventory_add.forEach(function(i){S.inventory.push(i)});
  if(Array.isArray(d.inventory_remove))S.inventory=S.inventory.filter(function(i){return d.inventory_remove.indexOf(i)<0});
  if(Array.isArray(d.flags_add))d.flags_add.forEach(function(f){if(S.flags.indexOf(f)<0)S.flags.push(f)});
  if(Array.isArray(d.flags_remove))S.flags=S.flags.filter(function(f){return d.flags_remove.indexOf(f)<0});
  if(d.faction_change&&typeof d.faction_change==='object'){for(var f in d.faction_change){if(!S.factions[f])S.factions[f]=0;S.factions[f]=Math.max(-100,Math.min(100,S.factions[f]+d.faction_change[f]))}}
  if(d.npc_notes&&typeof d.npc_notes==='object')for(var k in d.npc_notes)S.npcNotes[k]=d.npc_notes[k];
  if(Array.isArray(d.world_notes)){d.world_notes.forEach(function(w){S.worldEvents.push(w)});if(S.worldEvents.length>60)S.worldEvents=S.worldEvents.slice(-60)}
  if(typeof d.sukuna_finger_found==='number'){var num=d.sukuna_finger_found;if(num>=1&&num<=20&&S.sukunaFingers.indexOf(num)<0){S.sukunaFingers.push(num);toast('找到宿傩手指 #'+num)}}
  if(d.quest_complete){for(var i=0;i<S.quests.length;i++){if(S.quests[i].n===d.quest_complete){S.completedQuests.push(S.quests[i]);S.quests.splice(i,1);break}}}
  while(S.exp>=S.expMax){S.exp-=S.expMax;S.expMax=Math.floor(S.expMax*1.5);S.hpMax+=10;S.ceMax+=20;S.atk+=2;S.ctrl+=2;S.sp=(S.sp||0)+1;S.hp=S.hpMax;S.ce=S.ceMax;toast('升级！技能点+1')}
  checkTitles();
  if(d.dead===true||S.hp<=0){S.dead=true;S.deathCause=d.death_cause||'伤势过重';showDeath()}
  renderBar();if(TAB!=='story')renderTab();
}
function checkTitles(){TITLES.forEach(function(t){if(S.titles.indexOf(t.n)<0&&t.cond(S)){S.titles.push(t.n);toast('称号：'+t.n)}})}

function renderBar(){
  if(!S)return;
  $('bname').textContent=S.name+(S.dead?' · 已故':'');
  $('btime').textContent=S.time.label;
  var eq=getEq(),tHP=S.hpMax+eq.hp,tCE=S.ceMax+eq.ce;
  var hw=S.hp<tHP*.4?'warn':'ok',cw=tCE>0&&S.ce<tCE*.25?'warn':'ok';
  $('bstat').innerHTML=
  '<span class="'+hw+'">体<b>'+S.hp+'/'+tHP+'</b></span>'+
  '<span class="'+cw+'">咒<b>'+S.ce+'/'+tCE+'</b></span>'+
  '<span>战<b>'+(S.atk+eq.atk)+'</b></span>'+
  '<span>控<b>'+(S.ctrl+eq.ctrl)+'</b></span>'+
  '<span class="gold">等<b>'+S.grade+'</b></span>'+
  '<span class="gold">¥<b>'+S.money.toLocaleString()+'</b></span>'+
  '<span class="ice">经<b>'+S.exp+'/'+S.expMax+'</b></span>'+
  '<span class="em">技<b>'+(S.sp||0)+'</b></span>';
}
function switchTab(t){
  TAB=t;
  document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('on',x.dataset.tab===t)});
  if(t==='story'){$('main').innerHTML='';renderStory();$('foot').style.display=''}
  else{$('foot').style.display='none';renderTab()}
}
function line(l,v,c){return'<div class="line"><span class="l">'+l+'</span><span class="v '+(c||'')+'">'+v+'</span></div>'}
function renderTab(){
  var m=$('main');if(TAB==='story')return;var h='';
  if(TAB==='char')h=tabChar();
  else if(TAB==='skill')h=tabSkill();
  else if(TAB==='npc')h=tabNPC();
  else if(TAB==='quest')h=tabQuest();
  else if(TAB==='shop')h=tabShop();
  else if(TAB==='world')h=tabWorld();
  else if(TAB==='codex')h=tabCodex();
  else if(TAB==='sys')h=tabSys();
  m.innerHTML=h;bindTab();
}

    var fs='';for(var i=1;i<=20;i++){fs+=S.sukunaFingers.indexOf(i)>=0?'<span class="tg b">#'+i+'</span> ':'<span class="tg">#'+i+'</span> '}
    h+='<div class="card" style="line-height:2">'+fs+'</div>';
  }

  if(S.worldEvents.length)S.worldEvents.slice().reverse().forEach(function(e){h+='<div class="card">'+e+'</div>'});
  else h+='<div class="card" style="color:var(--ink3);border-left-color:transparent">这个世界还很安静。</div>';
  return h;
}

function bindTab(){
  document.querySelectorAll('[data-eq]').forEach(function(b){b.onclick=function(){changeEq(b.dataset.eq)}});
  document.querySelectorAll('[data-learn]').forEach(function(b){b.onclick=function(){learn(b.dataset.learn)}});
  document.querySelectorAll('[data-dev]').forEach(function(b){b.onclick=function(){develop(b.dataset.dev)}});
  document.querySelectorAll('[data-accept]').forEach(function(b){b.onclick=function(){accept(b.dataset.accept)}});
  document.querySelectorAll('[data-buy]').forEach(function(b){b.onclick=function(){buy(b.dataset.buy)}});
  document.querySelectorAll('[data-buyc]').forEach(function(b){b.onclick=function(){buyC(b.dataset.buyc)}});
  var b;
  b=$('btnSave');if(b)b.onclick=function(){saveLocal();toast('已保存')};
  b=$('btnExport');if(b)b.onclick=exportSave;
  b=$('btnImport');if(b)b.onclick=importSave;
  b=$('btnReset');if(b)b.onclick=function(){if(confirm('重开人生？')){localStorage.removeItem('jjk_v9');location.reload()}};
  b=$('btnDiary');if(b)b.onclick=writeDiary;
}

/* ==================== 游戏：叙事 ==================== */
function renderStory(){
  var m=$('main');m.innerHTML='';var lo=[];
  for(var i=0;i<HIST.length;i++){
    var h=HIST[i];
    if(h.role==='user'){if(h.content.indexOf('【开局设定】')===0)continue;addMsg('p',h.content)}
    else{var p=parseAI(h.content);if(p.ts)S.time.label=p.ts;addMsg('a',p.narrative);if(i===HIST.length-1)lo=p.options}
  }
  renderBar();renderOptions(lo);m.scrollTop=m.scrollHeight;
}
function addMsg(who,text){
  var m=$('main');var el=document.createElement('div');el.className='msg '+who;
  var w=document.createElement('div');w.className='who';
  w.textContent={p:'你',sys:'系统',err:'错误',ev:'事件',battle:'战斗',ai:'AI',a:'世界'}[who]||'世界';
  el.appendChild(w);
  var b=document.createElement('div');b.className='body';b.textContent=text||'';
  el.appendChild(b);m.appendChild(el);m.scrollTop=m.scrollHeight;
  return{el:el,body:b};
}
function renderOptions(opts){
  var el=$('options');el.innerHTML='';
  if(!opts||!opts.length){el.classList.remove('show');return}
  var lbl=document.createElement('div');lbl.className='lbl';
  lbl.innerHTML='<span>◇ 可以做的事</span><span class="hint">点✎可改成自定义</span>';
  el.appendChild(lbl);
  opts.forEach(function(text){
    var b=document.createElement('button');b.className='optbtn';
    var tx=document.createElement('span');tx.className='txt';tx.textContent=text;b.appendChild(tx);
    var pen=document.createElement('span');pen.className='pen';pen.textContent='✎';b.appendChild(pen);
    b.onclick=function(e){
      if(e.target===pen||e.target.parentNode===pen){
        showPrompt('改成你想做的事：',text,function(v){if(v&&v.trim()){renderOptions([]);send(v.trim())}});
        return;
      }
      renderOptions([]);send(text);
    };
    el.appendChild(b);
  });
  el.classList.add('show');
}

/* ==================== 主流程 ==================== */
async function send(text){
  if(BUSY||!text.trim()||!S||S.dead)return;
  if(TAB!=='story')switchTab('story');
  BUSY=true;$('send').disabled=true;renderOptions([]);
  addMsg('p',text);$('inp').value='';$('inp').style.height='auto';
  HIST.push({role:'user',content:text});
  var m=addMsg('a','');m.body.classList.add('cur');
  var full='';
  try{
    full=await callAI(buildSystem(),HIST,function(f){var p=parseAI(f);m.body.textContent=p.narrative;$('main').scrollTop=$('main').scrollHeight},2200);
  }catch(e){
    m.body.classList.remove('cur');m.el.className='msg err';m.el.querySelector('.who').textContent='错误';
    m.body.textContent=e.message+'\n\n检查API Key、余额、网络。';
    HIST.pop();BUSY=false;$('send').disabled=false;return;
  }
  var p=parseAI(full);
  m.body.classList.remove('cur');m.body.textContent=p.narrative;
  if(p.ts)S.time.label=p.ts;
  HIST.push({role:'assistant',content:full});
  if(HIST.length>30)HIST=HIST.slice(-30);
  applySt(p.st);
  renderBar();renderOptions(p.options);saveLocal();
  BUSY=false;$('send').disabled=false;$('main').scrollTop=$('main').scrollHeight;
}

/* ==================== 系统操作 ==================== */
function learn(id){
  var sk=null;for(var t in SKILL_TREE)SKILL_TREE[t].forEach(function(x){if(x.id===id)sk=x});
  if(!sk||S.skills.indexOf(id)>=0)return;
  if(S.sp<sk.c){toast('技能点不足');return}
  S.sp-=sk.c;S.skills.push(id);toast('学会：'+sk.n);
  if(id==='rv1')S.reverse='治愈（初阶）';
  if(id==='rv3')S.reverse='输出';
  if(id==='ts4')S.domain='开发中';
  saveLocal();renderTab();renderBar();
}
function accept(id){
  var q=null;QUEST_LIB.forEach(function(x){if(x.id===id)q=x});
  if(!q)return;if(S.quests.some(function(x){return x.id===id}))return;
  S.quests.push(q);toast('接受：'+q.n);
  switchTab('story');send('我接下「'+q.n+'」这个委托。'+q.d+'。我准备出发。');
}
function buy(id){
  var it=null;['weapon','armor','accessory'].forEach(function(sl){EQUIPMENT[sl].forEach(function(x){if(x.id===id)it=x})});
  if(!it)return;if(S.money<it.p){toast('钱不够');return}
  S.money-=it.p;S.inventory.push(it.n);toast('购买：'+it.n);
  saveLocal();renderTab();renderBar();
}
function buyC(name){
  var prices={'绷带':500,'止血药':2000,'咒力回复药':3000,'营养剂':5000};
  var pr=prices[name];if(!pr)return;if(S.money<pr){toast('钱不够');return}
  S.money-=pr;S.inventory.push(name);toast('购买：'+name);
  saveLocal();renderTab();renderBar();
}
function changeEq(slot){
  var list=EQUIPMENT[slot]||[];
  var own=list.filter(function(it){return it.id===S.equipment[slot]||S.inventory.indexOf(it.n)>=0});
  if(!own.length){toast('没有可装备的');return}
  showPrompt('更换装备（输入名字）',own.map(function(x){return x.n}).join(' / '),function(input){
    var p=input.trim();
    for(var i=0;i<own.length;i++)if(own[i].n===p){S.equipment[slot]=own[i].id;toast('已装备：'+own[i].n);saveLocal();renderTab();renderBar();return}
    toast('没找到');
  });
}
function writeDiary(){
  showPrompt('写一篇日记','',function(text){
    if(!text.trim())return;
    S.diary.push({t:S.time.label,text:text.trim()});toast('日记已保存');
    saveLocal();renderTab();
  });
}
function develop(type){
  if(BUSY||S.dead)return;
  var t='';
  if(type==='reverse')t='我花了一段时间反复琢磨反转术式。试着把咒力在体内叠加。';
  else if(type==='domain')t='我试着感受自己生得领域的轮廓。';
  else if(type==='blackflash')t='我反复挥拳，寻找黑闪的契机。';
  switchTab('story');send(t);
}

/* ==================== 弹窗 ==================== */
var pmCb=null;
function showPrompt(title,val,cb){
  $('pmTitle').textContent=title;
  $('pmInput').value=val||'';
  $('pm').classList.add('on');pmCb=cb;
  setTimeout(function(){$('pmInput').focus()},100);
}
function closePm(){$('pm').classList.remove('on');pmCb=null}

/* ==================== 死亡 ==================== */
function showDeath(){
  var t=S.name+'\n'+S.age+'岁 · '+(S.time.label||'')+'\n'+(S.identity||'')+' · '+(S.location||'')+
  '\n\n死因：'+(S.deathCause||'不详')+'\n\n这个世界不会因为你的死而停下。\n明天，东京的电车照常运行。';
  $('epi').textContent=t;$('death').classList.add('on');
}

/* ==================== 存档 ==================== */
function saveLocal(){try{localStorage.setItem('jjk_v9',JSON.stringify({CFG:CFG,HIST:HIST,S:S}))}catch(e){}}
function loadLocal(){try{var r=localStorage.getItem('jjk_v9');if(!r)return false;var d=JSON.parse(r);CFG=d.CFG;HIST=d.HIST||[];S=d.S;return true}catch(e){return false}}
function exportSave(){
  var txt=JSON.stringify({CFG:CFG,HIST:HIST,S:S});
  $('modalTitle').textContent='导出存档';
  $('modalText').value=txt;$('modalText').readOnly=true;
  $('modalAction').textContent='全选';
  $('modalAction').onclick=function(){$('modalText').select();try{document.execCommand('copy');toast('已复制')}catch(e){toast('请长按复制')}};
  $('modalClose').onclick=function(){$('modal').classList.remove('on')};
  $('modal').classList.add('on');
}
function importSave(){
  $('modalTitle').textContent='粘贴存档文本';
  $('modalText').value='';$('modalText').readOnly=false;
  $('modalText').placeholder='粘贴存档...';
  $('modalAction').textContent='导入';
  $('modalAction').onclick=function(){
    try{
      var d=JSON.parse($('modalText').value.trim());
      if(!d.S||!d.HIST)throw new Error('格式不对');
      CFG=d.CFG;HIST=d.HIST;S=d.S;saveLocal();
      $('modal').classList.remove('on');switchTab('story');renderBar();toast('导入成功');
    }catch(e){alert('导入失败：'+e.message)}
  };
  $('modalClose').onclick=function(){$('modal').classList.remove('on')};
  $('modal').classList.add('on');
}
function toast(t){
  var el=document.createElement('div');
  el.textContent=t;
  el.style.cssText='position:fixed;bottom:30%;left:50%;transform:translateX(-50%);background:rgba(20,18,16,.95);color:#d4cdbd;padding:9px 18px;border:1px solid #2c2720;font-size:11.5px;letter-spacing:.2em;z-index:700;font-family:monospace;pointer-events:none';
  document.body.appendChild(el);setTimeout(function(){el.remove()},1500);
}

  });

  };
  $('clearBtn').onclick=function(){if(confirm('删除本地存档？')){localStorage.removeItem('jjk_v9');alert('已删除')}};
  // 建角
  $('cSend').onclick=function(){handleCreateInput()};
  $('cCancel').onclick=function(){$('cInputRow').style.display='none';$('cInput').value=''};
  $('cInput').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleCreateInput()}});
  // 游戏
  $('send').onclick=function(){send($('inp').value)};
  $('inp').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send($('inp').value)}});
  $('inp').addEventListener('input',function(e){e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,110)+'px'});
  document.querySelectorAll('.tab').forEach(function(t){t.onclick=function(){switchTab(t.dataset.tab)}});
  $('modalClose').onclick=function(){$('modal').classList.remove('on')};
  $('pmCancel').onclick=closePm;
  $('pmOk').onclick=function(){if(pmCb)pmCb($('pmInput').value);closePm()};
  $('restart').onclick=function(){if(confirm('重开人生？')){localStorage.removeItem('jjk_v9');location.reload()}};
  window.addEventListener('beforeunload',saveLocal);
});
