<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0908">
<title>咒术人生</title>
<style>
:root{
  --bg:#0a0908;--panel:#141210;--line:#1f1c17;--line2:#2c2720;
  --ink:#d4cdbd;--ink2:#8a8275;--ink3:#4e4a42;
  --gold:#a08a56;--blood:#8a3a2e;--jade:#5a6a4a;
  --serif:'Songti SC','Noto Serif JP','Source Han Serif SC',Georgia,serif;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--serif);
  overflow:hidden;-webkit-font-smoothing:antialiased;font-size:16px;letter-spacing:.02em}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:999;opacity:.22;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.13'/%3E%3C/svg%3E")}

#app{position:relative;z-index:5;height:100%;max-width:680px;margin:0 auto;display:flex;flex-direction:column}

/* ===== 顶栏 ===== */
#bar{padding:calc(12px + env(safe-area-inset-top)) 22px 10px;border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:baseline;flex-shrink:0}
#bname{font-size:14px;letter-spacing:.2em;color:var(--ink)}
#bname.dim{color:var(--ink3)}
#btime{font-size:10.5px;color:var(--ink3);font-family:var(--mono);letter-spacing:.15em}

/* ===== 聊天 ===== */
#chat{flex:1;overflow-y:auto;padding:26px 22px 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#chat::-webkit-scrollbar{display:none}
.msg{margin-bottom:32px;animation:in .5s ease}
@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.msg .who{font-size:9px;color:var(--ink3);font-family:var(--mono);
  letter-spacing:.3em;margin-bottom:9px;text-transform:uppercase}
.msg .body{font-size:15.5px;line-height:2.05;white-space:pre-wrap;color:var(--ink);letter-spacing:.03em}
.msg.p .who{color:var(--gold)}
.msg.p .body{color:var(--ink2);font-style:italic;padding-left:14px;border-left:1px solid var(--line2);font-size:14.5px}
.msg.err .body{color:var(--blood)}
.msg.sys .who{color:var(--jade)}
.msg.sys .body{color:var(--ink2);font-size:13.5px}
.cur::after{content:'▌';color:var(--gold);animation:bk 1.1s steps(1) infinite;font-size:.85em;margin-left:1px}
@keyframes bk{50%{opacity:0}}

/* ===== 输入 ===== */
#foot{padding:12px 20px calc(14px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);flex-shrink:0;background:var(--bg)}
#row{display:flex;gap:10px;align-items:flex-end}
#inp{flex:1;background:none;border:none;border-bottom:1px solid var(--line2);
  color:var(--ink);font-family:var(--serif);font-size:15.5px;line-height:1.65;
  padding:9px 0;resize:none;outline:none;max-height:120px;letter-spacing:.03em;transition:border-color .3s}
#inp:focus{border-bottom-color:var(--gold)}
#inp::placeholder{color:var(--ink3);font-style:italic}
#send{width:40px;height:40px;border-radius:50%;background:none;border:1px solid var(--line2);
  color:var(--ink2);font-size:15px;cursor:pointer;flex-shrink:0;transition:all .2s;font-family:var(--mono)}
#send:active{border-color:var(--gold);color:var(--gold)}
#send:disabled{opacity:.25}

/* ===== 设置 ===== */
#setup{position:fixed;inset:0;background:var(--bg);z-index:400;display:flex;
  flex-direction:column;overflow-y:auto;
  padding:calc(40px + env(safe-area-inset-top)) 26px calc(30px + env(safe-area-inset-bottom));
  scrollbar-width:none}
#setup::-webkit-scrollbar{display:none}
.logo{text-align:center;margin-bottom:38px}
.logo h1{font-size:26px;letter-spacing:.6em;font-weight:400;color:var(--ink);
  margin-bottom:6px;padding-left:.6em}
.logo .sub{font-size:9.5px;color:var(--ink3);letter-spacing:.5em;
  font-family:var(--mono);padding-left:.5em}
.logo .ln{width:36px;height:1px;background:var(--gold);margin:20px auto 0;opacity:.55}
.sec{font-size:10px;letter-spacing:.35em;color:var(--ink3);font-family:var(--mono);
  margin:22px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:10px;color:var(--ink3);letter-spacing:.2em;
  margin-bottom:7px;font-family:var(--mono)}
.fld input,.fld select,.fld textarea{width:100%;background:none;border:none;
  border-bottom:1px solid var(--line2);color:var(--ink);padding:8px 0;
  font-family:var(--serif);font-size:14.5px;outline:none;border-radius:0;letter-spacing:.02em;transition:border-color .3s}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-bottom-color:var(--gold)}
.fld textarea{resize:vertical;min-height:50px;line-height:1.7;font-size:13.5px}
.fld select{-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 9px) 17px,calc(100% - 4px) 17px;background-size:5px 5px;background-repeat:no-repeat}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.hint{font-size:10px;color:var(--ink3);font-family:var(--mono);line-height:1.7;margin-top:8px;letter-spacing:.03em}
.hint a{color:var(--gold);text-decoration:none;border-bottom:1px dotted var(--gold)}
.go{width:100%;background:none;border:1px solid var(--gold);color:var(--gold);
  padding:16px;font-size:12.5px;letter-spacing:.6em;font-family:var(--serif);
  margin-top:30px;cursor:pointer;transition:all .3s;padding-left:.6em}
.go:active{background:var(--gold);color:var(--bg)}
.bar2{display:flex;gap:22px;margin-top:18px;justify-content:center}
.bar2 button{background:none;border:none;color:var(--ink3);padding:7px 0;
  font-size:10px;font-family:var(--mono);letter-spacing:.3em;cursor:pointer;
  border-bottom:1px solid transparent;transition:all .2s}
.bar2 button:active{color:var(--ink2);border-bottom-color:var(--line2)}

/* ===== 死亡 ===== */
#death{position:fixed;inset:0;background:#050505;z-index:500;display:none;
  flex-direction:column;align-items:center;justify-content:center;
  padding:50px 30px;text-align:center;animation:in 1.2s}
#death.on{display:flex}
#death .m{font-size:11px;color:var(--gold);letter-spacing:.7em;font-family:var(--mono);
  margin-bottom:32px;padding-left:.7em}
#death .g{font-size:80px;color:var(--blood);letter-spacing:.4em;margin-bottom:40px;
  font-weight:300;padding-left:.4em}
#death .e{font-size:13px;color:var(--ink2);line-height:2.3;max-width:440px;
  margin-bottom:48px;white-space:pre-wrap;letter-spacing:.06em}
#death .btn{background:none;border:1px solid var(--line2);color:var(--ink2);
  padding:14px 38px;font-size:11px;letter-spacing:.5em;font-family:var(--serif);
  cursor:pointer;padding-left:.5em;transition:all .3s}
#death .btn:active{border-color:var(--gold);color:var(--gold)}
</style>
</head>
<body>

<!-- ================= 设置 ================= -->
<div id="setup">
  <div class="logo">
    <h1>咒术人生</h1>
    <div class="sub">JUJUTSU KAISEN</div>
    <div class="ln"></div>
  </div>

  <div class="sec">◈ 接 入</div>
  <div class="fld">
    <label>服务商</label>
    <select id="pProv">
      <option value="deepseek">DeepSeek</option>
      <option value="openai">OpenAI</option>
      <option value="custom">自定义（OpenAI 兼容）</option>
    </select>
  </div>
  <div class="fld">
    <label>API Key</label>
    <input type="password" id="pKey" placeholder="sk-..." autocomplete="off">
    <div class="hint" id="pHint">去 <a href="https://platform.deepseek.com" target="_blank">platform.deepseek.com</a> 拿 key。10 元能玩很久。</div>
  </div>
  <div class="fld" id="urlF" style="display:none">
    <label>接口地址</label>
    <input type="text" id="pUrl" placeholder="https://.../v1/chat/completions">
  </div>
  <div class="fld" id="modF" style="display:none">
    <label>模型名</label>
    <input type="text" id="pModel" placeholder="qwen-plus">
  </div>

  <div class="sec">◈ 你 是 谁</div>
  <div class="two">
    <div class="fld"><label>姓名</label><input type="text" id="pName" value="虎杖悠仁" maxlength="10"></div>
    <div class="fld"><label>年龄</label><input type="number" id="pAge" value="15" min="6" max="60"></div>
  </div>
  <div class="fld"><label>性别</label>
    <select id="pGender"><option>男</option><option>女</option><option>其他</option></select>
  </div>
  <div class="fld"><label>时代</label>
    <select id="pEra">
      <option value="2018">2018 · 涩谷事变</option>
      <option value="2017">2017 · 百鬼夜行</option>
      <option value="2006">2006 · 怀玉·玉折</option>
      <option value="1980">1980 · 战后咒术界</option>
      <option value="1900">1900 · 明治</option>
      <option value="900">900 · 平安</option>
    </select>
  </div>
  <div class="fld"><label>出身</label>
    <select id="pOrigin">
      <option>普通人觉醒</option>
      <option>咒术师家庭</option>
      <option>御三家旁支</option>
      <option>天与咒缚</option>
      <option>受肉体 / 容器</option>
      <option>咒骸 / 人造生命</option>
      <option>诅咒师家庭</option>
      <option>非术师（能看见）</option>
      <option>星浆体</option>
    </select>
  </div>
  <div class="fld"><label>术式资质</label>
    <select id="pTech">
      <option>无术式</option>
      <option>普通生得术式</option>
      <option>良好生得术式</option>
      <option>优秀生得术式</option>
      <option>特殊 · 六眼/反转/领域天赋</option>
      <option>随机</option>
    </select>
  </div>
  <div class="fld"><label>居住地</label>
    <select id="pLoc">
      <option>东京</option><option>京都</option><option>仙台</option>
      <option>大阪</option><option>北海道</option><option>国外</option>
    </select>
  </div>
  <div class="fld">
    <label>一句话介绍自己（可选）</label>
    <textarea id="pBio" placeholder="例：我从小能看见别人看不见的东西。母亲说我疯了。"></textarea>
  </div>

  <button class="go" id="startBtn">开 始 人 生</button>
  <div class="bar2">
    <button id="loadBtn">读 取 存 档</button>
    <button id="helpBtn">说 明</button>
    <button id="clearBtn">删 除 存 档</button>
  </div>
</div>

<!-- ================= 游戏 ================= -->
<div id="app" style="display:none">
  <div id="bar">
    <div id="bname" class="dim">—</div>
    <div id="btime">—</div>
  </div>
  <div id="chat"></div>
  <div id="foot">
    <div id="row">
      <textarea id="inp" rows="1" placeholder="你要做什么……"></textarea>
      <button id="send">→</button>
    </div>
  </div>
</div>

<!-- ================= 死亡 ================= -->
<div id="death">
  <div class="m">终</div>
  <div class="g">死</div>
  <div class="e" id="epi"></div>
  <button class="btn" id="restart">重 新 开 始</button>
</div>

<script>
"use strict";

/* ============================================================
   咒术人生 · 对话版
   一个输入框，一个 AI，一个世界。
   ============================================================ */

var CFG = null;
var HIST = [];          // [{role, content}]
var BUSY = false;
var DEAD = false;
var TIMESTAMP_RE = /^\[(\d{4}年\d{1,2}月[^\]]*)\]\s*/;

var $ = function(id){ return document.getElementById(id); };
var chat = $('chat');
var inp = $('inp');

/* ---------------- System Prompt ---------------- */
function systemPrompt(){
  return [
'你是《咒术回战》世界的模拟引擎。你不是小说作者。你是世界本身。',
'',
'# 铁则',
'- 玩家做任何事，你推演真实后果。不偏袒，不鸡汤，不剧透。',
'- 世界不围绕玩家旋转。原著事件照常发生，无论玩家是否在场。',
'- 玩家可能一无所获，可能受伤，可能死。死了就是死了，不复活，不"但奇迹发生"。',
'- 玩家一个行动如果没有触发任何事，就让它平淡过去。不是每回合都有剧情。',
'- 不要问玩家问题。不要写"你可以选择……"。不要写小标题。',
'- 原著人物不 OOC：五条悟会笑但眼神是冷的；七海建人说话像疲惫的社畜；宿傩只为自己的乐趣行动；夏油杰优雅而疯狂；伏黑惠沉默但重情；钉崎野蔷薇直率强悍；虎杖悠仁善良坚韧；家入硝子冷静毒舌。',
'',
'# 世界观（原著正典）',
'咒力来自人类负面情绪。术师操控自身咒力，普通人泄漏咒力形成咒灵。',
'体系：生得术式 · 领域展开 · 反转术式（咒力×咒力）· 黑闪 · 束缚 · 天与咒缚。',
'势力：东京&京都高专 · 咒术总监部 · 御三家（五条/禅院/加茂）· 天元 · 薨星宫 · 盘星教。',
'特级咒物：宿傩手指（20根）· 狱门疆 · 天逆鉾 · 游云 · 释魂刀。',
'',
'# 时间锚定（严格）',
'- 2018年5月：虎杖悠仁入学，吞下宿傩手指',
'- 2018年6月：姐妹校交流会',
'- 2018年10月31日：涩谷事变，五条悟被狱门疆封印',
'- 2018年12月：死灭洄游发动',
'- 2017年12月：百鬼夜行，夏油杰死',
'- 2006年8月：怀玉·玉折，天内理子死',
'- 2007年9月：夏油杰叛逃',
'当游戏时间到达这些节点时，无论玩家在做什么，事件都要发生。',
'',
'# 时间推进',
'- 玩家输入某个行动，隐含一段时间流逝。你要在开头用一行写出当前时间。',
'- 如果玩家说"我训练一个月"，就真的推进一个月。',
'- 玩家没明确推进时，慢速推进（几天到一两周）。',
'',
'# 输出格式（严格）',
'第一行必须是时间戳：[YYYY年MM月某日] 或 [YYYY年MM月]。',
'第二行开始是叙事正文。200-400字。第二人称"你"。',
'冷、准、克制。像漫画旁白。具体细节胜过形容词。',
'不写"你感到恐惧"，写"你的手在抖，握不住刀"。',
'用中文。可以用 <em>文字</em> 表示强调（可选）。',
'',
'# 示例',
'[2018年5月14日]',
'你在高专后山练拳。天快黑了。',
'拳头上有一道旧伤，是上周祓除三级咒灵时留下的。它还没有完全好。你出拳的时候，它会隐隐作痛。',
'远处传来铃声。夜蛾校长在叫人了。',
'',
'（然后玩家会输入行动，你继续。）'
  ].join('\n');
}

/* ---------------- API ---------------- */
function apiUrl(){
  if(CFG.provider === 'deepseek') return 'https://api.deepseek.com/chat/completions';
  if(CFG.provider === 'openai')   return 'https://api.openai.com/v1/chat/completions';
  return CFG.url;
}
function apiModel(){
  if(CFG.provider === 'deepseek') return 'deepseek-chat';
  if(CFG.provider === 'openai')   return 'gpt-4o-mini';
  return CFG.model;
}

async function callAI(onDelta){
  // 保留 system + 最近 20 条消息，防止上下文爆炸
  var messages = [{role:'system', content: systemPrompt()}].concat(HIST);
  if(messages.length > 22){
    messages = [messages[0]].concat(messages.slice(-20));
  }

  var res = await fetch(apiUrl(), {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'Authorization':'Bearer ' + CFG.key
    },
    body: JSON.stringify({
      model: apiModel(),
      messages: messages,
      stream: true,
      temperature: 1.0,
      max_tokens: 1200,
      top_p: 0.95
    })
  });

  if(!res.ok){
    var t = await res.text();
    throw new Error('API ' + res.status + '：' + t.slice(0, 200));
  }

  var reader = res.body.getReader();
  var dec = new TextDecoder();
  var buf = '';
  var full = '';
  while(true){
    var r = await reader.read();
    if(r.done) break;
    buf += dec.decode(r.value, {stream: true});
    var lines = buf.split('\n');
    buf = lines.pop() || '';
    for(var i = 0; i < lines.length; i++){
      var line = lines[i];
      if(line.indexOf('data: ') !== 0) continue;
      var d = line.slice(6).trim();
      if(d === '[DONE]') continue;
      try{
        var j = JSON.parse(d);
        var delta = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
        if(delta){
          full += delta;
          if(onDelta) onDelta(full);
        }
      }catch(e){}
    }
  }
  return full;
}

/* ---------------- 消息渲染 ---------------- */
function addMsg(who, text){
  var el = document.createElement('div');
  el.className = 'msg ' + who;
  var w = document.createElement('div');
  w.className = 'who';
  w.textContent = who === 'p' ? '你' : who === 'sys' ? '系统' : who === 'err' ? '错误' : '世界';
  el.appendChild(w);
  var b = document.createElement('div');
  b.className = 'body';
  b.textContent = text || '';
  el.appendChild(b);
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return {el: el, body: b};
}

// 流式渲染时剥离时间戳
function stripTimestamp(full){
  // 还没写完 [ 或没 ]：隐藏开头
  if(full.charAt(0) === '['){
    var close = full.indexOf(']');
    if(close < 0) return {display: '', ts: null};
    var inner = full.slice(1, close);
    // 只有像 "2018年5月..." 才是时间戳
    if(/^\d{4}年/.test(inner)){
      return {
        display: full.slice(close + 1).replace(/^\s+/, ''),
        ts: inner
      };
    }
  }
  return {display: full, ts: null};
}

/* ---------------- 主流程 ---------------- */
async function send(text){
  if(BUSY || !text.trim() || DEAD) return;
  BUSY = true;
  $('send').disabled = true;

  addMsg('p', text);
  inp.value = '';
  inp.style.height = 'auto';

  HIST.push({role:'user', content: text});

  var m = addMsg('a', '');
  m.body.classList.add('cur');

  var lastTs = null;
  var finalFull = '';

  try{
    finalFull = await callAI(function(full){
      var parsed = stripTimestamp(full);
      m.body.textContent = parsed.display;
      if(parsed.ts) lastTs = parsed.ts;
      chat.scrollTop = chat.scrollHeight;
    });
  }catch(e){
    m.body.classList.remove('cur');
    m.el.className = 'msg err';
    m.el.querySelector('.who').textContent = '错误';
    m.body.textContent = e.message + '\n\n检查 API Key、余额、网络。';
    // 移除这条 user 消息，让玩家可以重试
    HIST.pop();
    BUSY = false;
    $('send').disabled = false;
    return;
  }

  m.body.classList.remove('cur');
  var parsed = stripTimestamp(finalFull);
  m.body.textContent = parsed.display;
  if(parsed.ts) lastTs = parsed.ts;

  if(lastTs) $('btime').textContent = lastTs;

  HIST.push({role:'assistant', content: finalFull});

  // 检查死亡（AI 会自然写"你死了"之类，这里做一个粗略检测）
  if(/你死了|你已经死亡|你断了气|你的意识消散/.test(parsed.display)){
    // 不立刻拉死，让玩家自己发现。但可以做一次提示
  }

  saveLocal();
  BUSY = false;
  $('send').disabled = false;
  chat.scrollTop = chat.scrollHeight;
}

/* ---------------- 存档 ---------------- */
function saveLocal(){
  try{
    localStorage.setItem('jjk_chat', JSON.stringify({CFG: CFG, HIST: HIST}));
  }catch(e){}
}
function loadLocal(){
  try{
    var raw = localStorage.getItem('jjk_chat');
    if(!raw) return false;
    var d = JSON.parse(raw);
    CFG = d.CFG;
    HIST = d.HIST || [];
    return true;
  }catch(e){ return false; }
}

/* ---------------- 开局 ---------------- */
async function startGame(){
  var key = $('pKey').value.trim();
  if(!key){ alert('请填 API Key'); return; }

  CFG = {
    provider: $('pProv').value,
    key: key,
    url: $('pUrl').value.trim(),
    model: $('pModel').value.trim()
  };

  var cfg = {
    era: $('pEra').value,
    origin: $('pOrigin').value,
    tech: $('pTech').value,
    name: $('pName').value.trim() || '无名',
    gender: $('pGender').value,
    age: parseInt($('pAge').value) || 15,
    loc: $('pLoc').value,
    bio: $('pBio').value.trim()
  };

  HIST = [];
  DEAD = false;
  $('btime').textContent = cfg.era + '年4月';
  $('bname').textContent = cfg.name;
  $('bname').classList.remove('dim');

  $('setup').style.display = 'none';
  $('app').style.display = 'flex';
  chat.innerHTML = '';

  // 开局第一条消息：告诉 AI 玩家档案
  var seed = '【开局设定】\n' +
    '时代：' + cfg.era + '年，起始时间 ' + cfg.era + '年4月\n' +
    '姓名：' + cfg.name + '｜' + cfg.age + '岁｜' + cfg.gender + '\n' +
    '出身：' + cfg.origin + '\n' +
    '术式资质：' + cfg.tech + '\n' +
    '居住地：' + cfg.loc + '\n' +
    '自我介绍：' + (cfg.bio || '（无）') + '\n\n' +
    '请写开场：明确他/她此刻在什么具体场景（结合时代、出身、年龄）。至少一个可感知的细节（声音、气味、温度、光线）。埋下伏笔但不要点破。250-350字。第一行必须是时间戳 [YYYY年MM月某日]。';

  await send(seed);
}

/* ---------------- 死亡 ---------------- */
function showDeath(cause){
  DEAD = true;
  $('epi').textContent = cause;
  $('death').classList.add('on');
}

/* ---------------- 事件绑定 ---------------- */
document.addEventListener('DOMContentLoaded', function(){

  $('pProv').addEventListener('change', function(e){
    var v = e.target.value;
    $('urlF').style.display = v === 'custom' ? '' : 'none';
    $('modF').style.display = v === 'custom' ? '' : 'none';
    var h = {
      deepseek: '去 <a href="https://platform.deepseek.com" target="_blank">platform.deepseek.com</a> 拿 key。10 元能玩很久。',
      openai: 'OpenAI 官方接口。需要海外支付方式。',
      custom: '任何 OpenAI 兼容接口：通义、Kimi、智谱、本地 Ollama。'
    };
    $('pHint').innerHTML = h[v];
  });

  $('startBtn').onclick = startGame;

  $('loadBtn').onclick = function(){
    if(loadLocal()){
      $('setup').style.display = 'none';
      $('app').style.display = 'flex';
      chat.innerHTML = '';
      // 重放历史
      for(var i = 0; i < HIST.length; i++){
        var h = HIST[i];
        if(h.role === 'user'){
          if(h.content.indexOf('【开局设定】') === 0) continue;
          addMsg('p', h.content);
        } else {
          var parsed = stripTimestamp(h.content);
          if(parsed.ts) $('btime').textContent = parsed.ts;
          addMsg('a', parsed.display);
        }
      }
      if(HIST.length > 0){
        // 尝试从第一条 user 消息恢复名字
        var first = HIST[0] && HIST[0].content || '';
        var nameMatch = first.match(/姓名：([^｜\n]+)/);
        if(nameMatch){
          $('bname').textContent = nameMatch[1].trim();
          $('bname').classList.remove('dim');
        }
      }
      chat.scrollTop = chat.scrollHeight;
    } else {
      alert('没有找到存档。');
    }
  };

  $('helpBtn').onclick = function(){
    alert('咒术人生 · 使用说明\n\n' +
      '1. 填 API Key（推荐 DeepSeek）\n' +
      '2. 选时代、出身、术式\n' +
      '3. 开始。之后你输入什么，世界就回应什么\n\n' +
      '示例输入：\n' +
      '· 我去高专找五条悟\n' +
      '· 逃课去涩谷\n' +
      '· 我想试着用咒力\n' +
      '· 找人打听宿傩手指的事\n' +
      '· 我训练一个月\n' +
      '· 我去便利店买点吃的\n\n' +
      'AI 会推演后果。原著事件按时间线发生。\n' +
      '死亡不可逆。');
  };

  $('clearBtn').onclick = function(){
    if(confirm('删除本地存档？')){
      localStorage.removeItem('jjk_chat');
      alert('已删除。');
    }
  };

  $('send').onclick = function(){ send(inp.value); };
  inp.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      send(inp.value);
    }
  });
  inp.addEventListener('input', function(e){
    e.target.style.height = 'auto';
    e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px';
  });

  $('restart').onclick = function(){
    if(confirm('重开人生？当前进度会丢失。')){
      localStorage.removeItem('jjk_chat');
      location.reload();
    }
  };

  window.addEventListener('beforeunload', saveLocal);
});
</script>
</body>
</html>
