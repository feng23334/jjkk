<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0908">
<title>咒术人生 · 完全形态</title>
<style>
:root{
  --bg:#0a0908;--paper:#12100d;--panel:#16140f;
  --ink:#d4cdbd;--ink2:#8a8275;--ink3:#4e4a42;
  --line:#1f1c17;--line2:#2c2720;
  --gold:#a08a56;--blood:#8a3a2e;--jade:#5a6a4a;--ice:#5a7a8a;--violet:#6a5a7a;
  --serif:'Songti SC','Noto Serif JP','Source Han Serif SC',Georgia,serif;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--serif);
  overflow:hidden;-webkit-font-smoothing:antialiased;font-size:16px;letter-spacing:.02em}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:999;opacity:.22;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.13'/%3E%3C/svg%3E")}
#app{position:relative;z-index:5;height:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column}

/* 顶栏 */
#bar{padding:calc(10px + env(safe-area-inset-top)) 18px 7px;border-bottom:1px solid var(--line);flex-shrink:0}
.bar1{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;gap:10px}
#bname{font-size:14.5px;letter-spacing:.2em;color:var(--ink);flex-shrink:0}
#btime{font-size:10.5px;color:var(--ink3);font-family:var(--mono);letter-spacing:.15em;text-align:right}
.bar2{display:flex;gap:10px;font-size:9.5px;color:var(--ink3);font-family:var(--mono);flex-wrap:wrap}
.bar2 b{color:var(--ink2);font-weight:400;margin-left:2px}
.bar2 .warn b{color:var(--blood)}
.bar2 .ok b{color:var(--jade)}
.bar2 .gold b{color:var(--gold)}

/* 标签 */
#tabs{display:flex;border-bottom:1px solid var(--line);flex-shrink:0;padding:0 10px;overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:none;color:var(--ink3);padding:9px 11px;font-size:10px;
  font-family:var(--mono);letter-spacing:.2em;cursor:pointer;white-space:nowrap;
  border-bottom:2px solid transparent;transition:all .2s}
.tab.on{color:var(--ink);border-bottom-color:var(--gold)}

/* 主区 */
#main{flex:1;overflow-y:auto;padding:20px 18px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#main::-webkit-scrollbar{display:none}

/* 叙事 */
.msg{margin-bottom:28px;animation:in .5s ease}
@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.msg .who{font-size:9px;color:var(--ink3);font-family:var(--mono);
  letter-spacing:.3em;margin-bottom:8px;text-transform:uppercase}
.msg .body{font-size:15.5px;line-height:2.05;white-space:pre-wrap;color:var(--ink);letter-spacing:.03em}
.msg.p .who{color:var(--gold)}
.msg.p .body{color:var(--ink2);font-style:italic;padding-left:14px;border-left:1px solid var(--line2);font-size:14.5px}
.msg.err .body{color:var(--blood)}
.msg.sys .who{color:var(--jade)}
.msg.sys .body{color:var(--ink2);font-size:13.5px}
.cur::after{content:'▌';color:var(--gold);animation:bk 1.1s steps(1) infinite;font-size:.85em;margin-left:1px}
@keyframes bk{50%{opacity:0}}

/* 面板 */
.sec{font-size:10.5px;letter-spacing:.3em;color:var(--ink3);font-family:var(--mono);
  margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.sec:first-child{margin-top:0}
.line{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #1a1713;font-size:13.5px;gap:10px}
.line .l{color:var(--ink3);font-family:var(--mono);font-size:11px;flex-shrink:0}
.line .v{color:var(--ink);text-align:right;max-width:65%}
.line .v.gold{color:var(--gold)}
.line .v.b{color:var(--blood)}
.line .v.g{color:var(--jade)}
.line .v.i{color:var(--ice)}
.card{background:var(--paper);border-left:2px solid var(--line2);padding:10px 12px;margin-bottom:7px;font-size:13px;line-height:1.7}
.card .t{color:var(--ink);font-size:13.5px;margin-bottom:3px}
.card .s{color:var(--ink3);font-size:10.5px;font-family:var(--mono);margin-bottom:5px;letter-spacing:.08em}
.card .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.tg{display:inline-block;background:#1a1713;border:1px solid var(--line2);
  color:var(--ink2);border-radius:10px;padding:1px 7px;font-size:9.5px;font-family:var(--mono)}
.tg.gold{color:var(--gold);border-color:#3a3020}
.tg.b{color:var(--blood);border-color:#3a2020}
.tg.g{color:var(--jade);border-color:#203020}
.tg.i{color:var(--ice);border-color:#203040}
.tg.v{color:var(--violet);border-color:#30203a}
.pb{height:2px;background:#1a1713;margin:4px 0 10px;overflow:hidden}
.pb .f{height:100%;transition:width .4s}
.pb .f.hp{background:linear-gradient(90deg,#5a3a2a,#a08a6a)}
.pb .f.ce{background:linear-gradient(90deg,#2a4a5a,#6a8aa0)}
.pb .f.exp{background:linear-gradient(90deg,#6a5a2a,#a09050)}

.opts{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.opt{background:var(--paper);border:1px solid var(--line2);color:var(--ink);
  padding:10px 14px;text-align:left;font-family:var(--serif);font-size:13.5px;
  cursor:pointer;transition:all .2s;border-radius:0;line-height:1.5}
.opt:active{border-color:var(--gold);background:var(--panel)}

/* 底部 */
#foot{padding:10px 16px calc(14px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);flex-shrink:0;background:var(--bg);
  max-height:62vh;overflow-y:auto;scrollbar-width:none}
#foot::-webkit-scrollbar{display:none}
#options{display:none;flex-direction:column;gap:6px;margin-bottom:10px}
#options.show{display:flex}
#options .lbl{font-size:9.5px;color:var(--ink3);font-family:var(--mono);
  letter-spacing:.3em;margin-bottom:2px;padding-left:2px}
.optbtn{background:var(--panel);border:1px solid var(--line2);color:var(--ink);
  padding:10px 13px;text-align:left;font-family:var(--serif);font-size:13.5px;
  cursor:pointer;transition:all .18s;border-radius:0;line-height:1.5}
.optbtn:active{border-color:var(--gold);background:#1a1713}
#row{display:flex;gap:10px;align-items:flex-end}
#inp{flex:1;background:none;border:none;border-bottom:1px solid var(--line2);
  color:var(--ink);font-family:var(--serif);font-size:15.5px;line-height:1.65;
  padding:9px 0;resize:none;outline:none;max-height:120px;letter-spacing:.03em;transition:border-color .3s}
#inp:focus{border-bottom-color:var(--gold)}
#inp::placeholder{color:var(--ink3);font-style:italic}
#send{width:40px;height:40px;border-radius:50%;background:none;border:1px solid var(--line2);
  color:var(--ink2);font-size:15px;cursor:pointer;flex-shrink:0;transition:all .2s;font-family:var(--mono)}
#send:active{border-color:var(--gold);color:var(--gold)}
#send:disabled{opacity:.25}

/* 设置 */
#setup{position:fixed;inset:0;background:var(--bg);z-index:400;display:flex;
  flex-direction:column;overflow-y:auto;
  padding:calc(36px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom));
  scrollbar-width:none}
#setup::-webkit-scrollbar{display:none}
.logo{text-align:center;margin-bottom:32px}
.logo h1{font-size:25px;letter-spacing:.6em;font-weight:400;color:var(--ink);
  margin-bottom:6px;padding-left:.6em}
.logo .sub{font-size:9.5px;color:var(--ink3);letter-spacing:.5em;
  font-family:var(--mono);padding-left:.5em}
.logo .ln{width:36px;height:1px;background:var(--gold);margin:18px auto 0;opacity:.55}
.sec-t{font-size:10px;letter-spacing:.35em;color:var(--ink3);font-family:var(--mono);
  margin:20px 0 11px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:10px;color:var(--ink3);letter-spacing:.2em;
  margin-bottom:6px;font-family:var(--mono)}
.fld input,.fld select,.fld textarea{width:100%;background:none;border:none;
  border-bottom:1px solid var(--line2);color:var(--ink);padding:7px 0;
  font-family:var(--serif);font-size:14.5px;outline:none;border-radius:0;letter-spacing:.02em;transition:border-color .3s}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-bottom-color:var(--gold)}
.fld textarea{resize:vertical;min-height:46px;line-height:1.7;font-size:13.5px}
.fld select{-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 9px) 16px,calc(100% - 4px) 16px;background-size:5px 5px;background-repeat:no-repeat}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hint{font-size:10px;color:var(--ink3);font-family:var(--mono);line-height:1.7;margin-top:7px;letter-spacing:.03em}
.hint a{color:var(--gold);text-decoration:none;border-bottom:1px dotted var(--gold)}
.go{width:100%;background:none;border:1px solid var(--gold);color:var(--gold);
  padding:16px;font-size:12.5px;letter-spacing:.6em;font-family:var(--serif);
  margin-top:28px;cursor:pointer;transition:all .3s;padding-left:.6em}
.go:active{background:var(--gold);color:var(--bg)}
.bar3{display:flex;gap:20px;margin-top:18px;justify-content:center;flex-wrap:wrap}
.bar3 button{background:none;border:none;color:var(--ink3);padding:7px 0;
  font-size:10px;font-family:var(--mono);letter-spacing:.3em;cursor:pointer;
  border-bottom:1px solid transparent;transition:all .2s}

/* 死亡 */
#death{position:fixed;inset:0;background:#050505;z-index:500;display:none;
  flex-direction:column;align-items:center;justify-content:center;
  padding:50px 30px;text-align:center;animation:in 1.2s}
#death.on{display:flex}
#death .m{font-size:11px;color:var(--gold);letter-spacing:.7em;font-family:var(--mono);
  margin-bottom:30px;padding-left:.7em}
#death .g{font-size:80px;color:var(--blood);letter-spacing:.4em;margin-bottom:36px;
  font-weight:300;padding-left:.4em}
#death .e{font-size:13px;color:var(--ink2);line-height:2.3;max-width:440px;
  margin-bottom:44px;white-space:pre-wrap;letter-spacing:.06em}
#death .btn{background:none;border:1px solid var(--line2);color:var(--ink2);
  padding:13px 30px;font-size:11px;letter-spacing:.5em;font-family:var(--serif);
  cursor:pointer;padding-left:.5em;transition:all .3s;border-radius:0}
#death .btn.primary{border-color:var(--gold);color:var(--gold)}

/* 弹窗 */
#modal{position:fixed;inset:0;background:rgba(5,5,5,.95);z-index:600;display:none;
  align-items:center;justify-content:center;padding:20px}
#modal.on{display:flex}
#modal .inner{background:var(--paper);border:1px solid var(--line2);max-width:560px;
  width:100%;padding:22px;max-height:85vh;overflow-y:auto;scrollbar-width:none}
#modal .inner::-webkit-scrollbar{display:none}
#modal h3{font-size:13px;letter-spacing:.25em;margin-bottom:14px;color:var(--ink);font-weight:400}
#modal textarea{width:100%;background:var(--bg);border:1px solid var(--line2);
  color:var(--ink);font-family:var(--mono);font-size:11px;line-height:1.6;padding:10px;
  min-height:220px;resize:vertical;outline:none}
#modal .btns{display:flex;gap:10px;margin-top:14px}
#modal .btns button{flex:1;background:none;border:1px solid var(--line2);color:var(--ink2);
  padding:10px;font-size:11px;font-family:var(--mono);letter-spacing:.2em;cursor:pointer;border-radius:0}
#modal .btns button.primary{border-color:var(--gold);color:var(--gold)}
</style>
</head>
<body>

<!-- ============ 设置 ============ -->
<div id="setup">
  <div class="logo">
    <h1>咒术人生</h1>
    <div class="sub">JUJUTSU KAISEN</div>
    <div class="ln"></div>
  </div>

  <div class="sec-t">◈ 接 入 A I</div>
  <div class="fld">
    <label>服务商</label>
    <select id="pProv">
      <option value="deepseek">DeepSeek（推荐）</option>
      <option value="openai">OpenAI</option>
      <option value="custom">自定义（OpenAI 兼容）</option>
    </select>
  </div>
  <div class="fld">
    <label>API Key</label>
    <input type="password" id="pKey" placeholder="sk-..." autocomplete="off" autocapitalize="off" autocorrect="off">
    <div class="hint" id="pHint">去 <a href="https://platform.deepseek.com" target="_blank">platform.deepseek.com</a> 拿 key。10 元能玩很久。</div>
  </div>
  <div class="fld" id="urlF" style="display:none">
    <label>接口地址</label>
    <input type="text" id="pUrl" placeholder="https://.../v1/chat/completions" autocapitalize="off" autocorrect="off">
  </div>
  <div class="fld" id="modF" style="display:none">
    <label>模型名</label>
    <input type="text" id="pModel" placeholder="qwen-plus" autocapitalize="off" autocorrect="off">
  </div>

  <div class="sec-t">◈ 创 建 角 色</div>
  <div class="two">
    <div class="fld"><label>姓名</label><input type="text" id="pName" value="虎杖悠仁" maxlength="10"></div>
    <div class="fld"><label>年龄</label><input type="number" id="pAge" value="15" min="6" max="60"></div>
  </div>
  <div class="fld"><label>性别</label>
    <select id="pGender"><option>男</option><option>女</option><option>其他</option></select>
  </div>
  <div class="fld"><label>时代</label>
    <select id="pEra">
      <option value="2018">2018 · 涩谷事变前后（虎杖入学）</option>
      <option value="2017">2017 · 百鬼夜行前后（乙骨入学）</option>
      <option value="2006">2006 · 怀玉·玉折（五条·夏油高专时代）</option>
      <option value="1980">1980 · 战后咒术界</option>
      <option value="1900">1900 · 明治·加茂宪伦事件</option>
      <option value="1600">1600 · 战国～江户</option>
      <option value="900">900 · 平安（宿傩活跃期）</option>
    </select>
  </div>
  <div class="fld"><label>出身</label>
    <select id="pOrigin">
      <option>普通人觉醒</option>
      <option>咒术师家庭</option>
      <option>御三家旁支</option>
      <option>天与咒缚</option>
      <option>受肉体 / 容器</option>
      <option>咒骸 / 人造生命</option>
      <option>诅咒师家庭</option>
      <option>非术师（能看见）</option>
      <option>星浆体</option>
    </select>
  </div>
  <div class="fld"><label>术式资质</label>
    <select id="pTech">
      <option>随机</option>
      <option>无术式</option>
      <option>普通生得术式</option>
      <option>良好生得术式</option>
      <option>优秀生得术式</option>
      <option>特殊 · 六眼/反转/领域天赋</option>
    </select>
  </div>
  <div class="fld"><label>居住地</label>
    <select id="pLoc">
      <option>东京</option><option>京都</option><option>仙台</option>
      <option>大阪</option><option>北海道</option><option>国外</option>
    </select>
  </div>
  <div class="fld"><label>性格关键词（逗号分隔，可选）</label>
    <input type="text" id="pTrait" placeholder="例：坚韧,好奇,重情" maxlength="30">
  </div>
  <div class="fld">
    <label>一句话介绍自己（可选）</label>
    <textarea id="pBio" placeholder="例：我从小能看见别人看不见的东西。母亲说我疯了。"></textarea>
  </div>

  <button class="go" id="startBtn">开 始 人 生</button>
  <div class="bar3">
    <button id="loadBtn">读 取 存 档</button>
    <button id="helpBtn">说 明</button>
    <button id="clearBtn">删 除 存 档</button>
  </div>
</div>

<!-- ============ 游戏 ============ -->
<div id="app" style="display:none">
  <div id="bar">
    <div class="bar1">
      <div id="bname" class="dim">—</div>
      <div id="btime">—</div>
    </div>
    <div class="bar2" id="bstat"></div>
  </div>
  <div id="tabs">
    <button class="tab on" data-tab="story">叙 事</button>
    <button class="tab" data-tab="char">状 态</button>
    <button class="tab" data-tab="skill">术 式</button>
    <button class="tab" data-tab="npc">关 系</button>
    <button class="tab" data-tab="world">世 界</button>
    <button class="tab" data-tab="codex">图 鉴</button>
    <button class="tab" data-tab="sys">系 统</button>
  </div>
  <div id="main"></div>
  <div id="foot">
    <div id="options"></div>
    <div id="row">
      <textarea id="inp" rows="1" placeholder="你要做什么……（也可以自己输入）"></textarea>
      <button id="send">→</button>
    </div>
  </div>
</div>

<!-- ============ 死亡 ============ -->
<div id="death">
  <div class="m">终</div>
  <div class="g">死</div>
  <div class="e" id="epi"></div>
  <button class="btn primary" id="restart">重 新 开 始</button>
</div>

<!-- ============ 弹窗 ============ -->
<div id="modal">
  <div class="inner">
    <h3 id="modalTitle">存档</h3>
    <textarea id="modalText"></textarea>
    <div class="btns">
      <button id="modalClose">关闭</button>
      <button id="modalAction" class="primary">确定</button>
    </div>
  </div>
</div>

<script>
"use strict";

/* =====================================================================
   咒术人生 · 完全形态
   所有角色 · 所有术式 · 所有时间 · 整个咒术回战
   ===================================================================== */

/* =====================================================================
   一、全角色数据库
   ===================================================================== */
var CAST = {
  /* ─── 东京高专 · 教师与职员 ─── */
  '五条悟':{j:'特级咒术师 / 高专教师',aff:'东京高专 / 五条家',tech:'无下限咒术 · 六眼 · 领域「无量空处」',gr:'特级',era:[1980,2006,2017,2018],note:'轻浮，话多，但眼神极冷。最强，也最孤独。'},
  '夜蛾正道':{j:'高专校长 / 咒骸使',aff:'东京高专',tech:'咒骸操术',gr:'一级',era:[1980,2006,2017,2018],note:'严肃，关心学生。会做咒骸玩偶。'},
  '家入硝子':{j:'高专校医 / 反转术式使',aff:'东京高专',tech:'反转术式（治疗）',gr:'无评级',era:[1980,2006,2017,2018],note:'冷静、毒舌、抽烟。看惯死亡。'},
  '七海建人':{j:'一级咒术师',aff:'东京高专',tech:'十划咒法 · 黑闪',gr:'一级',era:[1980,2006,2017,2018],note:'疲惫的社畜语气。"咒术师是狗屎。"'},
  '伊地知洁高':{j:'辅助监督',aff:'东京高专',tech:'无',gr:'非术师',era:[2006,2017,2018],note:'胆小但尽责。'},
  '灰原雄':{j:'已故术师',aff:'东京高专',tech:'未知',gr:'三级',era:[1980,2006],note:'开朗热心。死于任务。',dead:true},

  /* ─── 东京高专 · 学生 ─── */
  '虎杖悠仁':{j:'一级 / 宿傩容器',aff:'东京高专',tech:'迳庭拳 · 赤血操术 · 黑闪',gr:'一级',era:[2017,2018],note:'善良坚韧。体格怪物。会为死人崩溃。'},

function stateToText(){
  if(!S) return '';
  var lines = [];
  lines.push('姓名：' + S.name + '｜性别：' + S.gender + '｜年龄：' + S.age + '岁');
  lines.push('出身：' + S.origin + '｜身份：' + S.identity);
  lines.push('所在地：' + S.location + '｜时间：' + S.time.label);
  lines.push('体力 ' + S.hp + '/' + S.hpMax + '｜咒力 ' + S.ce + '/' + S.ceMax);
  lines.push('战斗 ' + S.atk + '｜控制 ' + S.ctrl + '｜声望 ' + S.reputation + '｜资产 ¥' + S.money);
  lines.push('生得术式：' + (S.innate || '无'));
  lines.push('掌握：' + (S.technique || '无'));
  lines.push('领域：' + (S.domain || '未觉醒') + '｜反转术式：' + (S.reverse || '无') + '｜黑闪：' + (S.blackflash || 0) + '次');
  if(S.vows && S.vows.length) lines.push('束缚：' + S.vows.join('、'));
  lines.push('持有物：' + (S.inventory.length ? S.inventory.join('、') : '无'));
  if(S.flags.length) lines.push('标记：' + S.flags.join('、'));
  if(Object.keys(S.npcNotes).length){
    lines.push('对以下人物的了解：');
    for(var k in S.npcNotes) lines.push('  · ' + k + '：' + S.npcNotes[k]);
  }
  if(S.worldEvents.length){
    lines.push('世界近况：');
    S.worldEvents.slice(-6).forEach(function(w){ lines.push('  · ' + w); });
  }
  return lines.join('\n');
}

/* =====================================================================
   九、API 调用
   ===================================================================== */
function apiUrl(){
  if(CFG.provider === 'deepseek') return 'https://api.deepseek.com/chat/completions';
  if(CFG.provider === 'openai')   return 'https://api.openai.com/v1/chat/completions';
  return CFG.url;
}
function apiModel(){
  if(CFG.provider === 'deepseek') return 'deepseek-chat';
  if(CFG.provider === 'openai')   return 'gpt-4o-mini';
  return CFG.model;
}

async function callAI(onDelta){
  var messages = [{role:'system', content: buildSystem()}].concat(HIST);
  if(messages.length > 26){
    messages = [messages[0]].concat(messages.slice(-24));
  }

  var res = await fetch(apiUrl(), {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'Authorization':'Bearer ' + CFG.key
    },
    body: JSON.stringify({
      model: apiModel(),
      messages: messages,
      stream: true,
      temperature: 1.0,
      max_tokens: 2000,
      top_p: 0.95
    })
  });

  if(!res.ok){
    var t = await res.text();
    throw new Error('API ' + res.status + '：' + t.slice(0, 200));
  }

  var reader = res.body.getReader();
  var dec = new TextDecoder();
  var buf = '';
  var full = '';
  while(true){
    var r = await reader.read();
    if(r.done) break;
    buf += dec.decode(r.value, {stream: true});
    var lines = buf.split('\n');
    buf = lines.pop() || '';
    for(var i = 0; i < lines.length; i++){
      var line = lines[i];
      if(line.indexOf('data: ') !== 0) continue;
      var d = line.slice(6).trim();
      if(d === '[DONE]') continue;
      try{
        var j = JSON.parse(d);
        var delta = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
        if(delta){
          full += delta;
          if(onDelta) onDelta(full);
        }
      }catch(e){}
    }
  }
  return full;
}

/* =====================================================================
   十、解析
   ===================================================================== */
function parseAI(full){
  var tsMatch = full.match(/^\[([^\]\n]{1,40})\]\s*/);
  var ts = tsMatch ? tsMatch[1] : null;
  var rest = tsMatch ? full.slice(tsMatch[0].length) : full;

  rest = rest.replace(/<\/?叙事>/g, '');

  var optIdx = rest.search(/<选项?/);
  var stIdx = rest.search(/<状态?/);
  var cutIdx = [optIdx, stIdx].filter(function(i){ return i >= 0; });
  var narrative = rest.slice(0, cutIdx.length ? Math.min.apply(null, cutIdx) : undefined).trim();

  var options = [];
  var optMatch = rest.match(/<选项>([\s\S]*?)<\/选项>/);
  if(optMatch){
    options = optMatch[1].split('\n')
      .map(function(l){
        return l.replace(/^[-·•*\d.\s、]+/, '').replace(/<\/?选项>/g, '').trim();
      })
      .filter(function(l){ return l.length > 0 && l.length < 80; })
      .slice(0, 5);
  }

  var stateDelta = null;
  var stMatch = rest.match(/<状态>([\s\S]*?)<\/状态>/);
  if(stMatch){
    var js = stMatch[1].trim().replace(/^```(?:json)?\s*/, '').replace(/```\s*$/, '').trim();
    try { stateDelta = JSON.parse(js); }
    catch(e){
      try { stateDelta = JSON.parse(js.replace(/,\s*([}\]])/g, '$1')); }
      catch(e2){ stateDelta = null; }
    }
  }

  return {ts: ts, narrative: narrative, options: options, stateDelta: stateDelta};
}

/* =====================================================================
   十一、状态系统
   ===================================================================== */
function newState(cfg){
  var era = parseInt(cfg.era);
  var hpMax = 100, ceMax = 150, atk = 15, ctrl = 20, money = 8000;
  var o = cfg.origin;
  if(o === '咒术师家庭'){ ceMax = 280; atk = 22; ctrl = 35; money = 30000; }
  if(o === '御三家旁支'){ ceMax = 320; atk = 25; ctrl = 40; money = 150000; }
  if(o === '天与咒缚'){ ceMax = 0; atk = 75; ctrl = 5; hpMax = 180; }
  if(o === '受肉体 / 容器'){ ceMax = 600; hpMax = 150; }
  if(o === '星浆体'){ ceMax = 500; hpMax = 120; }
  if(o === '非术师（能看见）'){ ceMax = 60; hpMax = 90; atk = 10; ctrl = 15; }
  if(o === '诅咒师家庭'){ ceMax = 250; atk = 28; ctrl = 30; money = 15000; }
  if(o === '咒骸 / 人造生命'){ ceMax = 280; hpMax = 110; }

  var tech = '无';
  if(cfg.tech === '随机'){
    var r = Math.random();
    if(r < 0.3) tech = '无';
    else if(r < 0.6) tech = '简单的强化术式';
    else if(r < 0.85) tech = '十划咒法';
    else tech = '十种影法术（未完全觉醒）';
  } else if(cfg.tech === '无术式'){ tech = '无'; }
  else if(cfg.tech === '普通生得术式'){ tech = '简单的强化术式'; }
  else if(cfg.tech === '良好生得术式'){ tech = '十划咒法'; }
  else if(cfg.tech === '优秀生得术式'){ tech = '十种影法术（未完全觉醒）'; }
  else if(cfg.tech === '特殊 · 六眼/反转/领域天赋'){ tech = '六眼（未觉醒）'; }

  var traits = (cfg.trait || '').split(/[,，]/).map(function(s){ return s.trim(); }).filter(Boolean).slice(0, 3);

  return {
    name: cfg.name, gender: cfg.gender, age: parseInt(cfg.age) || 15,
    origin: o, era: era,
    time: { y: era, m: 4, d: 1, label: cfg.era + '年4月' },
    location: cfg.loc,
    identity: cfg.age <= 18 ? '高专学生（预定）' : '自由术师',
    hp: hpMax, hpMax: hpMax, ce: ceMax, ceMax: ceMax,
    atk: atk, ctrl: ctrl, money: money, reputation: 0,
    exp: 0, expMax: 100,
    innate: tech, technique: tech === '无' ? '咒力操作（基础）' : tech,
    domain: '未觉醒', reverse: '无', blackflash: 0, vows: [],
    inventory: [], flags: [],
    npcNotes: {}, worldEvents: [],
    dead: false, deathCause: '',
    gen: 1, bio: cfg.bio, traits: traits
  };
}

function applyDelta(d){
  if(!d || !S) return;
  if(d.ts) S.time.label = d.ts;
  if(typeof d.hp === 'number') S.hp = d.hp;
  if(typeof d.hpMax === 'number') S.hpMax = d.hpMax;
  if(typeof d.ce === 'number') S.ce = d.ce;
  if(typeof d.ceMax === 'number') S.ceMax = d.ceMax;
  if(typeof d.atk === 'number') S.atk = d.atk;
  if(typeof d.ctrl === 'number') S.ctrl = d.ctrl;
  if(typeof d.money === 'number') S.money = d.money;
  if(typeof d.reputation === 'number') S.reputation = d.reputation;
  if(d.location) S.location = d.location;
  if(d.identity) S.identity = d.identity;
  if(d.innate) S.innate = d.innate;
  if(d.technique) S.technique = d.technique;
  if(d.domain) S.domain = d.domain;
  if(d.reverse) S.reverse = d.reverse;
  if(typeof d.blackflash === 'number') S.blackflash = d.blackflash;

  if(Array.isArray(d.vows)) S.vows = d.vows;
  if(Array.isArray(d.inventory_add)) d.inventory_add.forEach(function(i){ S.inventory.push(i); });
  if(Array.isArray(d.inventory_remove)){
    S.inventory = S.inventory.filter(function(i){ return d.inventory_remove.indexOf(i) < 0; });
  }
  if(Array.isArray(d.flags_add)){
    d.flags_add.forEach(function(f){ if(S.flags.indexOf(f) < 0) S.flags.push(f); });
  }
  if(Array.isArray(d.flags_remove)){
    S.flags = S.flags.filter(function(f){ return d.flags_remove.indexOf(f) < 0; });
  }
  if(d.npc_notes && typeof d.npc_notes === 'object'){
    for(var k in d.npc_notes) S.npcNotes[k] = d.npc_notes[k];
  }
  if(Array.isArray(d.world_notes)){
    d.world_notes.forEach(function(w){ S.worldEvents.push(w); });
    if(S.worldEvents.length > 50) S.worldEvents = S.worldEvents.slice(-50);
  }
  if(d.dead === true || S.hp <= 0){
    S.dead = true;
    S.deathCause = d.death_cause || '伤势过重';
    showDeath();
  }
  renderBar();
  if(TAB !== 'story') renderTab();
}

function renderBar(){
  if(!S) return;
  $('bname').textContent = S.name + (S.dead ? ' · 已故' : '');
  $('btime').textContent = S.time.label;
  var hw = S.hp < S.hpMax * 0.4 ? 'warn' : 'ok';
  var cw = S.ceMax > 0 && S.ce < S.ceMax * 0.25 ? 'warn' : 'ok';
  $('bstat').innerHTML =
    '<span class="' + hw + '">体<b>' + S.hp + '/' + S.hpMax + '</b></span>' +
    '<span class="' + cw + '">咒<b>' + S.ce + '/' + S.ceMax + '</b></span>' +
    '<span>战<b>' + S.atk + '</b></span>' +
    '<span>控<b>' + S.ctrl + '</b></span>' +
    '<span class="gold">名<b>' + S.reputation + '</b></span>' +
    '<span class="gold">¥<b>' + S.money.toLocaleString() + '</b></span>';
}

function switchTab(t){
  TAB = t;
  document.querySelectorAll('.tab').forEach(function(x){
    x.classList.toggle('on', x.dataset.tab === t);
  });
  if(t === 'story'){
    $('main').innerHTML = '';
    renderStoryFromHistory();
    $('foot').style.display = '';
  } else {
    $('foot').style.display = 'none';
    renderTab();
  }
}

    if(confirm('重开人生？当前进度会丢失。')){
      localStorage.removeItem('jjk_complete');
      location.reload();
    }
  };
  b = $('devReverse'); if(b) b.onclick = function(){ develop('reverse'); };
  b = $('devDomain'); if(b) b.onclick = function(){ develop('domain'); };
  b = $('devBlackflash'); if(b) b.onclick = function(){ develop('blackflash'); };
}

function line(l, v, cls){
  return '<div class="line"><span class="l">' + l + '</span><span class="v ' + (cls || '') + '">' + v + '</span></div>';
}

/* =====================================================================
   十三、叙事
   ===================================================================== */
function renderStoryFrom History(){
  var main = $(' varmain');
  main.innerHTML = '';
  main var lastOptions = [];
  for(var i = 0; i < HIST.length; i++){
    var h = HIST[i];
    if(h.role === 'user'){
      if(h.content.indexOf('【开局设定】') === 0) continue;
      addMsgEl('p', h.content);
    } else {
      var p = parseAI(h.content);
      if(p.ts) S.time.label = p.ts;
      addMsgEl('a', p.narrative);
      if(i === HIST.length - 1) lastOptions = p.options;
    }
  }
  renderBar();
  renderOptions(lastOptions);
  main.scrollTop = main.scrollHeight;
}

function addMsgEl(who, text){
 = $('main');
  var el = document.createElement('div');
  el.className = 'msg ' + who;
  var w = document.createElement('div');
  w.className = 'who';
  w.textContent = who === 'p' ? '你' : who === 'sys' ? '系统' : who === 'err' ? '错误' : '世界';
  el.appendChild(w);
  var b = document.createElement('div');
  b.className = 'body';
  b.textContent = text || '';
  el.appendChild(b);
  main.appendChild(el);
  main.scrollTop = main.scrollHeight;
  return {el: el, body: b};
}

function renderOptions(opts){
  var el = $('options');
  el.innerHTML = '';
  if(!opts || !opts.length){
    el.classList.remove('show');
    return;
  }
  var lbl = document.createElement('div');
  lbl.className = 'lbl';
  lbl.textContent = '◇ 可以做的事';
  el.appendChild(lbl);
  opts.forEach(function(text){
    var b = document.createElement('button');
    b.className = 'optbtn';
    b.textContent = text;
    b.onclick = function(){
      renderOptions([]);
      send(text);
    };
    el.appendChild(b);
  });
  el.classList.add('show');
}

/* =====================================================================
   十四、主流程
   ===================================================================== */
async function send(text){
  if(BUSY || !text.trim() || !S || S.dead) return;
  if(TAB !== 'story') switchTab('story');
  BUSY = true;
  $('send').disabled = true;
  renderOptions([]);

  addMsgEl('p', text);
  $('inp').value = '';
  $('inp').style.height = 'auto';

  HIST.push({role:'user', content: text});

  var m = addMsgEl('a', '');
  m.body.classList.add('cur');

  var finalFull = '';
  try{
    finalFull = await callAI(function(full){
      var p = parseAI(full);
      m.body.textContent = p.narrative;
      $('main').scrollTop = $('main').scrollHeight;
    });
  }catch(e){
    m.body.classList.remove('cur');
    m.el.className = 'msg err';
    m.el.querySelector('.who').textContent = '错误';
    m.body.textContent = e.message + '\n\n检查 API Key、余额、网络。';
    HIST.pop();
    BUSY = false;
    $('send').disabled = false;
    return;
  }

  var p = parseAI(finalFull);
  m.body.classList.remove('cur');
  m.body.textContent = p.narrative;

  if(p.ts) S.time.label = p.ts;
  HIST.push({role:'assistant', content: finalFull});
  if(HIST.length > 26) HIST = HIST.slice(-26);

  applyDelta(p.stateDelta);
  renderBar();
  renderOptions(p.options);
  saveLocal();

  BUSY = false;
  $('send').disabled = false;
  $('main').scrollTop = $('main').scrollHeight;
}

/* =====================================================================
   十五、能力开发
   ===================================================================== */
function develop(type){
  if(BUSY || S.dead) return;
  var text = '';
  if(type === 'reverse') text = '我花了一段时间，反复琢磨反转术式。试着把咒力在体内叠加。';
  else if(type === 'domain') text = '我试着感受自己生得领域的轮廓。这需要极度的专注。';
  else if(type === 'blackflash') text = '我反复挥拳，寻找黑闪的契机。集中力放到极致。';
  switchTab('story');
  send(text);
}

/* =====================================================================
   十六、死亡
   ===================================================================== */
function showDeath(){
  var txt = S.name + '\n' +
    S.age + '岁 · ' + (S.time.label || '') + '\n' +
    (S.identity || '') + ' · ' + (S.location || '') + '\n\n' +
    '死因：' + (S.deathCause || '不详') + '\n\n' +
    '这个世界不会因为你的死而停下。\n明天，东京的电车照常运行。';
  $('epi').textContent = txt;
  $('death').classList.add('on');
}

/* =====================================================================
   十七、存档
   ===================================================================== */
function saveLocal(){
  try{ localStorage.setItem('jjk_complete', JSON.stringify({ CFG: CFG, HIST: HIST, S: S })); }
  catch(e){}
}
function loadLocal(){
  try{
    var raw = localStorage.getItem('jjk_complete');
    if(!raw) return false;
    var d = JSON.parse(raw);
    CFG = d.CFG; HIST = d.HIST || []; S = d.S;
    return true;
  }catch(e){ return false; }
}

function exportSave(){
  var txt = JSON.stringify({ CFG: CFG, HIST: HIST, S: S });
  $('modalTitle').textContent = '导出存档';
  $('modalText').value = txt;
  $('modalText').readOnly = true;
  $('modalAction').textContent = '全选';
  $('modalAction').onclick = function(){
    $('modalText').select();
    try{ document.execCommand('copy'); toast('已复制'); }
    catch(e){ toast('请长按选择复制'); }
  };
  $('modalClose').onclick = function(){ $('modal').classList.remove('on'); };
  $('modal').classList.add('on');
}

function importSave(){
  $('modalTitle').textContent = '粘贴存档文本';
  $('modalText').value = '';
  $('modalText').readOnly = false;
  $('modalText').placeholder = '把之前导出的存档粘贴到这里...';
  $('modalAction').textContent = '导入';
  $('modalAction').onclick = function(){
    try{
      var txt = $('modalText').value.trim();
      var d = JSON.parse(txt);
      if(!d.S || !d.HIST) throw new Error('格式不对');
      CFG = d.CFG; HIST = d.HIST; S = d.S;
      saveLocal();
      $('modal').classList.remove('on');
      switchTab('story');
      renderBar();
      toast('导入成功');
    }catch(e){
      alert('导入失败：' + e.message);
    }
  };
  $('modalClose').onclick = function(){ $('modal').classList.remove('on'); };
  $('modal').classList.add('on');
}

function toast(text){
  var t = document.createElement('div');
  t.textContent = text;
  t.style.cssText = 'position:fixed;bottom:30%;left:50%;transform:translateX(-50%);' +
    'background:rgba(20,18,16,.95);color:#d4cdbd;padding:10px 20px;border:1px solid #2c2720;' +
    'font-size:12px;letter-spacing:.2em;z-index:700;font-family:monospace;pointer-events:none;';
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 1500);
}

/* =====================================================================
   十八、开局
   ===================================================================== */
async function startGame(){
  var key = $('pKey').value.trim();
  if(!key){ alert('请填 API Key'); return; }

  CFG = {
    provider: $('pProv').value,
    key: key,
    url: $('pUrl').value.trim(),
    model: $('pModel').value.trim()
  };

  var cfg = {
    era: $('pEra').value,
    origin: $('pOrigin').value,
    tech: $('pTech').value,
    name: $('pName').value.trim() || '无名',
    gender: $('pGender').value,
    age: parseInt($('pAge').value) || 15,
    loc: $('pLoc').value,
    bio: $('pBio').value.trim(),
    trait: $('pTrait').value.trim()
  };

  S = newState(cfg);
  HIST = [];

  $('setup').style.display = 'none';
  $('app').style.display = 'flex';
  switchTab('story');
  renderBar();

  var seed = '【开局设定】\n' +
    '时代：' + cfg.era + '年，起始时间 ' + cfg.era + '年4月\n' +
    '姓名：' + cfg.name + '｜' + cfg.age + '岁｜' + cfg.gender + '\n' +
    '出身：' + cfg.origin + '\n' +
    '术式资质：' + cfg.tech + '\n' +
    '居住地：' + cfg.loc + '\n' +
    '性格：' + (cfg.trait || '（未指定）') + '\n' +
    '自我介绍：' + (cfg.bio || '（无）') + '\n\n' +
    '请写开场。要求：\n' +
    '1. 明确他/她此刻在什么具体场景（结合时代、出身、年龄）。\n' +
    '2. 至少一个可感知的细节——声音、气味、温度、光线。\n' +
    '3. 埋下伏笔但不要点破。\n' +
    '4. 250-350字。\n' +
    '5. 不要问玩家问题。\n' +
    '6. 输出格式：时间戳行 + 叙事 + <选项> + <状态>。';

  await send(seed);
}
